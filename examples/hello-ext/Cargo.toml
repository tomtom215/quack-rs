[package]
name = "hello-ext"
version = "0.1.0"
edition = "2021"
rust-version = "1.86.0"
authors = ["Tom F"]
license = "MIT"
description = "Example DuckDB community extension built with quack-rs: word_count, first_word, generate_series_ext, VARCHAR→INTEGER cast"

[lib]
name = "hello_ext"
crate-type = ["cdylib"]

[dependencies]
quack_rs = { path = "../..", package = "quack-rs" }
libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }

[profile.release]
# Must be "unwind": quack-rs wraps every `extern "C"` boundary in
# `catch_unwind`, and `catch_unwind` cannot catch anything under
# `panic = "abort"` -- the runtime aborts before unwinding starts, which
# silently disables the crate's panic safety. `validate_release_profile`
# rejects "abort" for this reason, and the scaffold generates "unwind".
panic = "unwind"
lto = true
codegen-units = 1
opt-level = 3
strip = true
