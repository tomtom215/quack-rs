[package]
name = "hello-ext"
version = "0.1.0"
edition = "2021"
rust-version = "1.86.0"
authors = ["Tom F"]
license = "MIT"
description = "Example DuckDB community extension built with quack-rs: word_count, first_word, generate_series_ext, VARCHAR→INTEGER cast"

[lib]
name = "hello_ext"
crate-type = ["cdylib"]

[dependencies]
quack_rs = { path = "../..", package = "quack-rs" }
libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }

[profile.release]
# `unwind`, not `abort`. quack-rs catches panics at every FFI boundary with
# `std::panic::catch_unwind` and turns them into DuckDB errors; under
# `panic = "abort"` that machinery is inert and any panic in extension code
# takes the whole DuckDB process down. `validate_release_profile` rejects
# `abort` outright, and `the_example_obeys_the_crates_own_release_profile_rules`
# in `tests/integration_test.rs` holds this file to it.
panic = "unwind"
lto = true
codegen-units = 1
opt-level = 3
strip = true
