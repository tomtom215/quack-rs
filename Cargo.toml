[package]
name = "quack-rs"
version = "0.17.0"
edition = "2021"
rust-version = "1.86.0"
authors = ["Tom F. <tomf@tomtomtech.net>"]
description = "Production-grade Rust SDK for building DuckDB loadable extensions"
license = "MIT"
repository = "https://github.com/tomtom215/quack-rs"
homepage = "https://quack-rs.com"
documentation = "https://docs.rs/quack-rs"
readme = "README.md"
keywords = ["duckdb", "extension", "ffi", "sql", "analytics"]
categories = ["database", "api-bindings", "development-tools::ffi"]
autobenches = false
exclude = [
    "docs/",
    "examples/",
    "fuzz/",
    ".github/",
    "book/",
    "book.toml",
    "assets/",
    "deny.toml",
    "osv-scanner.toml",
    "AUDIT.md",
    "RELEASING.md",
    "LESSONS.md",
    "clippy.toml",
    "codecov.yml",
    "mutants.toml",
    "rust-toolchain.toml",
    "lsan-suppressions.txt",
]

[lib]
name = "quack_rs"
crate-type = ["rlib"]

[features]

## Enables the `testing::InMemoryDb` helper — a real in-memory DuckDB database
## for SQL-level integration tests — by **compiling DuckDB from C++ source**
## (the `duckdb` crate's `bundled` feature). No env vars required; cold builds
## take ~5-10 min. This is the safe, reproducible default for SQL-level tests.
##
## Prefer `bundled-test-prebuilt` to link a pre-built libduckdb instead (faster,
## no C++ compile). The two are mutually exclusive in intent; if both are
## enabled, the source (`bundled`) build wins.
##
## Enabling this feature also initialises the `loadable-extension` dispatch
## table from the linked DuckDB symbols, so `InMemoryDb::open()` works in
## `cargo test` even though no DuckDB host process loads the extension.
##
## # What this makes testable
##
## Once the dispatch table is populated, the **whole** C API works — including
## quack-rs's own wrappers. You can register a scalar/table/aggregate function on
## a raw connection, run SQL against it, and assert on the result, all inside
## `cargo test`. See `tests/ffi_roundtrip.rs`, which round-trips every vector type
## that way.
##
## `MockVectorWriter` / `MockVectorReader` remain useful for unit-testing callback
## logic without a database, and are the only option when the `bundled-test`
## features are off.
##
## # Usage in your extension
##
## ```toml
## [dev-dependencies]
## quack-rs = { version = "0.16", features = ["bundled-test"] }
## ```
bundled-test = ["_duckdb-testing", "duckdb/bundled"]

## Same capability as `bundled-test`, but links a **pre-built libduckdb** rather
## than compiling DuckDB from C++ source — much faster, at the cost of supplying
## the library yourself via exactly one of:
##   - `DUCKDB_DOWNLOAD_LIB=1` — `libduckdb-sys` downloads the upstream DuckDB
##     release zip (~40 MB, cached under `target/`). Recommended.
##   - `DUCKDB_LIB_DIR=/path/to/libduckdb` — link a libduckdb tree you already
##     have (also set `DUCKDB_INCLUDE_DIR` if `duckdb.hpp` isn't beside the lib).
##
## Requires `libduckdb-sys >= 1.10503` (which publishes the header directory via
## `DEP_DUCKDB_INCLUDE`); older versions need `DUCKDB_INCLUDE_DIR` set explicitly.
##
## ```toml
## [dev-dependencies]
## quack-rs = { version = "0.16", features = ["bundled-test-prebuilt"] }
## ```
bundled-test-prebuilt = ["_duckdb-testing"]

## Internal implementation detail — **do not enable directly.** Activates the
## optional `duckdb` dependency and gates the `InMemoryDb` helper and its tests.
## Enabled transitively by `bundled-test` (source build) and
## `bundled-test-prebuilt` (pre-built libduckdb); those two differ only in
## whether `duckdb/bundled` is also turned on.
_duckdb-testing = ["dep:duckdb"]
## Enables wrappers for DuckDB 1.5.0 C API additions (e.g. scalar function local
## states, config option registration). Requires `libduckdb-sys >= 1.5.0` to be
## resolved by Cargo. Has no effect when compiled against libduckdb-sys 1.4.x.
##
## Requires `libduckdb-sys >= 1.10500.0` (DuckDB 1.5.0+) to be resolved by Cargo.
## Enables wrappers for new C Extension API surfaces:
## - `TypeId::TimeNs` column type
## - `TypeId::Any`, `TypeId::Varint`, `TypeId::SqlNull`, `TypeId::IntegerLiteral`, `TypeId::StringLiteral` column types
## - Scalar function bind/init lifecycle and local state
## - Scalar function varargs and volatile flags
## - Config option registration (extension-defined settings)
## - Copy function support (custom `COPY TO` handlers)
## - Catalog entry lookup (incl. `Catalog::type_name`)
## - Client context access (file system, config, catalog)
## - Table description column count and types (`TableDescription` itself needs no feature)
## - Structured error data + UTF-8 validation (`ErrorData`, `DuckDbErrorType`, `check_valid_utf8`)
## - Bound expression inspection / constant folding (`Expression`, `ScalarBindInfo::argument`)
## - Virtual file system access (`FileSystem`, `FileHandle`, `FileOpenOptions`)
## - Appender `error_data` / `clear` / `append_default_to_chunk` (the appender
##   itself needs no feature, and reports richer errors with this one on)
## - Zero-copy selection vectors (`SelectionVector`)
## - Database instance cache (`InstanceCache`)
## - `Value::display_string` and `TIME_NS` accessors (`Value::time_ns` / `as_time_ns`)
duckdb-1-5 = []

## Enables wrappers layered on top of `duckdb-1-5` that require DuckDB **1.5.3+**.
## Implies (and re-enables) `duckdb-1-5`.
##
## Requires `libduckdb-sys >= 1.10503.1` (DuckDB 1.5.3) to be resolved by Cargo:
## the gated items reference C type-enum constants that do not exist in
## libduckdb-sys 1.5.0–1.5.2, so enabling this feature against an older binding
## is a compile error (by design — it surfaces the version mismatch immediately).
## This is the same soft-contract style as `duckdb-1-5` (which targets 1.5.0).
##
## Gates:
## - `TypeId::Variant` (`DUCKDB_TYPE_VARIANT`, 41) — added to the C type enum in
##   DuckDB 1.5.3.
## - `TypeId::Geometry` (`DUCKDB_TYPE_GEOMETRY`, 40) — present earlier in the
##   1.5.x line, but gated here at the 1.5.3 floor so one feature covers both new
##   type-enum values behind a single, verifiable version requirement.
duckdb-1-5-3 = ["duckdb-1-5"]

## Enables the Arrow C Data Interface bridge ([`arrow`](arrow) module) — the
## `duckdb_to_arrow_schema` / `duckdb_data_chunk_to_arrow` /
## `duckdb_schema_from_arrow` / `duckdb_data_chunk_from_arrow` family plus the
## `duckdb_arrow_options` accessors. Implies (and re-enables) `duckdb-1-5-3`.
##
## Unlike the other version features, the floor here is set by the **bindings**,
## not by DuckDB: every one of these functions is present in `duckdb_ext_api_v1`
## from DuckDB **1.5.0** onward (verified against the v1.5.0 `duckdb_extension.h`),
## but `libduckdb-sys` declared `ArrowSchema` / `ArrowArray` as opaque
## zero-sized bindgen placeholders (`_unused: [u8; 0]`) until **1.10504.0**,
## which is the first release to ship the real `#[repr(C)]` Arrow C Data
## Interface layouts. You cannot allocate the caller-owned structs these APIs
## require before that.
##
## So: requires `libduckdb-sys >= 1.10504.0` to be resolved by Cargo, and a
## DuckDB **1.5.0+** engine at run time. Enabling it against an older binding is
## a compile error (by design — `src/arrow.rs` carries a `const` assertion that
## names the cause).
##
## No `arrow` crate dependency is added: the module works on the ABI structs
## `libduckdb-sys` defines, which have the same layout as arrow-rs's
## `FFI_ArrowSchema` / `FFI_ArrowArray` (libduckdb-sys asserts this in its own
## test suite), so bridging is a pointer cast rather than a shared dependency.
duckdb-1-5-4 = ["duckdb-1-5-3"]

[dependencies]
libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }
duckdb = { version = ">=1.4.4, <2", optional = true }
mutants = "0.0.4"

[build-dependencies]
# Used only when `bundled-test` / `bundled-test-prebuilt` is active: compiles the
# thin C++ shim that calls DuckDB's internal CreateAPIv1() to initialise the
# loadable-extension dispatch table from the linked DuckDB symbols.
cc = "1"

[dev-dependencies]
# `duckdb` is intentionally NOT a dev-dependency: it is an optional regular
# dependency activated only by `bundled-test` / `bundled-test-prebuilt`, so that
# a plain `cargo test` (and every downstream consumer's lockfile) stays free of
# the DuckDB + arrow tree.
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
# tempfile is version-pinned for reproducible dev builds. It was originally held
# back to avoid getrandom >=0.4 (edition2024 / Rust >=1.85) when MSRV was 1.84.1;
# now that MSRV is 1.86.0 that constraint no longer applies, but the pin is kept
# to avoid unrelated dev-dependency churn. proptest only needs `tempfile ^3`.
tempfile = "=3.27.0"

[[bench]]
name = "interval_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# `unwind`, matching what quack-rs tells extensions to use and what the scaffold
# generates. quack-rs catches panics at every FFI boundary with `catch_unwind`,
# which cannot catch anything under `panic = "abort"`. This crate is an rlib, so
# Cargo ignores the setting downstream either way — but it should not contradict
# the crate's own guidance.
panic = "unwind"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Rust API guideline C-DEBUG. Not cosmetic: without `Debug`, `Result::unwrap`,
# `Result::expect_err`, `assert_eq!` and `#[derive(Debug)]` on any downstream
# struct holding one of our types all fail to compile. CI runs clippy with
# `-D warnings`, which promotes this to an error there.
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow common SDK API patterns that trigger noisy false-positives
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"

[package.metadata.docs.rs]
# Render the full API on docs.rs — including the `duckdb-1-5` / `duckdb-1-5-3`
# feature-gated modules and `TypeId` variants — so the documentation (and the
# README's docs.rs links) resolve. Without this, docs.rs builds the empty default
# feature set and every feature-gated item would be missing. `bundled-test` is
# intentionally excluded (it compiles DuckDB from source).
features = ["duckdb-1-5-4"]
