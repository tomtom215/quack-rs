# SPDX-License-Identifier: MIT
#
# Fuzz targets for quack-rs.
#
# Deliberately a separate, unpublished crate rather than a workspace member:
# `cargo-fuzz` requires nightly and libFuzzer, and the root crate's MSRV job
# must stay able to build the whole workspace on stable.
[package]
name = "quack-rs-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The same bindings quack-rs uses (fuzz/Cargo.lock pins the release), for the
# raw `duckdb_create_*` constructors in `value_render`.
libduckdb-sys = { version = ">=1.4.4, <1.20100", default-features = false, features = ["loadable-extension"] }

[dependencies.quack-rs]
path = ".."

[[bin]]
name = "description_yml"
path = "fuzz_targets/description_yml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "duck_string"
path = "fuzz_targets/duck_string.rs"
test = false
doc = false
bench = false

[features]
# Targets that call into a real DuckDB: needs a libduckdb (`DUCKDB_LIB_DIR`).
live = ["quack-rs/bundled-test-prebuilt", "quack-rs/duckdb-1-5-4"]

[[bin]]
name = "value_render"
path = "fuzz_targets/value_render.rs"
required-features = ["live"]
test = false
doc = false
bench = false

[[bin]]
name = "validators"
path = "fuzz_targets/validators.rs"
test = false
doc = false
bench = false

[[bin]]
name = "append_metadata"
path = "fuzz_targets/append_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scaffold_text"
path = "fuzz_targets/scaffold_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "description_roundtrip"
path = "fuzz_targets/description_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_version"
path = "fuzz_targets/abi_version.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
