#
# Configuration for cargo-mutants — mutation testing for quack-rs.
#
# This file MUST live at `.cargo/mutants.toml`: that is the only place
# cargo-mutants reads configuration from without `--config`. Until September
# 2026 it sat at the repository root, where no job ever read it, and it also
# carried two keys cargo-mutants 27.1.0 rejects outright (`cap_timeout`,
# `jobs`), so pointing `--config` at it would have failed to parse. The
# per-mutant timeout cap and the job count are passed on the command line by
# `.github/workflows/mutants.yml` (`--timeout 120 --jobs 4`).
#
# Install:  cargo install cargo-mutants
# Run:      cargo mutants
# Docs:     https://mutants.rs/

# ── Timeout ──────────────────────────────────────────────────────────────────
# Generous timeout multiplier so tests don't flake under mutation.
# The base timeout is auto-detected from `cargo test`.
timeout_multiplier = 3.0

# Floor: no mutant gets less than 30s even if the baseline is very fast.
minimum_test_timeout = 30



# ── Files to test ───────────────────────────────────────────────────────────
# No `examine_globs`: the default already examines every source file, and a
# config-level `examine_globs` would *override* a command-line `--file` rather
# than be narrowed by it — which turned the incremental job (one `--file` per
# changed file) into a full sweep. `exclude_globs` below still applies.

# ── Features ─────────────────────────────────────────────────────────────────
# Enable duckdb-1-5-4 (implies duckdb-1-5-3, which implies duckdb-1-5) so
# feature-gated code paths and their tests are included in mutation testing —
# including the duckdb-1-5-3 `TypeId` variants (Geometry / Variant) and the
# duckdb-1-5-4 arrow bridge. Without this, mutants in
# #[cfg(feature = "duckdb-1-5...")] blocks are untestable (the tests that kill
# them are also feature-gated).
features = ["duckdb-1-5-4"]

# ── Exclusions ───────────────────────────────────────────────────────────────
# Thin re-export modules and test-only code produce unproductive mutants.
exclude_globs = [
    "src/prelude.rs",           # pure re-exports
    "src/callback.rs",          # macro-generated FFI wrappers (untestable without DuckDB runtime)
    "src/chunk_writer.rs",      # Drop calls FFI; row tracking tested via unit tests
    "src/vector/struct_writer.rs", # thin delegation to VectorWriter (requires DuckDB runtime)
    "src/vector/struct_reader.rs", # thin delegation to VectorReader (requires DuckDB runtime)
    "src/testing/harness.rs",   # test harness infrastructure (FFI wiring)
    "src/testing/in_memory_db.rs", # thin wrapper around DuckDB C API
    "src/testing/mock_vector.rs",  # test-only vector stub
    "src/testing/mock_vector/*.rs", # the same stub, split out of mock_vector.rs
    "src/testing/mod.rs",       # re-exports only
    "src/bin/**",               # binary entry points
    # DuckDB 1.5.x FFI wrapper modules: every public method calls a DuckDB C
    # function that panics in `cargo test` without a live runtime, so their
    # mutants cannot be killed by unit tests (same rationale as the entries
    # above). Their pure-logic siblings — e.g. `DuckDbErrorType` in error_data.rs
    # and the `TypeId` conversions — are NOT excluded and stay mutation-tested.
    "src/expression.rs",        # Expression: all methods call duckdb_expression_*
    "src/file_system.rs",       # FileSystem/FileHandle: all methods call duckdb FS API
    "src/appender.rs",          # Appender: all methods call duckdb_appender_*
    "src/appender/*.rs",        # the same Appender methods, split out of appender.rs
    "src/selection_vector.rs",  # SelectionVector: new() calls duckdb_create_selection_vector
    "src/instance_cache.rs",    # InstanceCache: all methods call duckdb_*_instance_cache
    "src/table_description.rs", # TableDescription: FFI methods; tests are bundled-test-gated
    "src/scalar/info.rs",       # Scalar{Function,Bind,Init}Info: FFI accessor wrappers
    "src/copy_function/info.rs",# Copy{Bind,GlobalInit,Sink,Finalize}Info: FFI accessor wrappers
    # The two largest FFI-wrapper modules, same rationale, split so that the
    # rationale actually holds: every function still in these two files calls a
    # DuckDB C API, so a --lib run with no live engine cannot kill any of their
    # mutants. Their pure logic was moved out into sibling modules that are NOT
    # excluded and stay mutation-tested:
    #   src/value.rs -> src/value/hugeint.rs  (128-bit word splitting)
    #                -> src/value/defaults.rs (the fourteen as_*_or accessors)
    #   src/query.rs -> src/query/cstr.rs     (to_c_sql, c_str_to_owned)
    # A path glob matches the file only, so the sibling modules are unaffected,
    # and cargo-mutants still follows the mod statements in an excluded file.
    "src/value.rs",             # Value: 130 duckdb_get_* / duckdb_create_* wrappers
    "src/query.rs",             # QueryResult/PreparedStatement/Connection: FFI wrappers
    # The same wrappers, split out of query.rs; src/query/cstr.rs stays in.
    "src/query/bind.rs",
    "src/query/chunk.rs",
    "src/query/connection.rs",
    "src/query/live_tests.rs",
    "src/query/prepared.rs",
    "src/query/result.rs",
    # Same rationale, added with the September 2026 audit fixes. Their pure
    # logic lives in siblings that stay in the gate: src/value/checks.rs (the
    # DECIMAL range check and the scalar-cast allow-list).
    "src/value/getters.rs",     # Value::as_*: each copies the value and calls duckdb_get_*
    # Split out of value.rs with the same rationale: every function reads the
    # value through duckdb_get_list_size / _list_child / _map_size / _map_key /
    # _map_value / _struct_child / duckdb_get_value_type. Its siblings
    # composite.rs, scalars.rs, temporal.rs and temporal_checks.rs stay in:
    # their range and count checks run before any DuckDB call (composite.rs's
    # FFI-only checks are dropped in exclude_re below instead).
    "src/value/nested.rs",      # Value::list_* / struct_* / map_* readers: duckdb_get_*
    "src/vector/nested_null.rs",# walks a vector's type and child masks through the C API
    # FFI-only wrappers that were missing from this list: every surviving
    # mutant in them (Sept 2026 run) is in a function that only calls DuckDB
    # (`CatalogEntry::name`, `ClientContext::connection_id`,
    # `DbConfig::get_flag`, their `Drop`s). Their behaviour is covered end to
    # end in tests/ffi_roundtrip.rs; the pure `CatalogEntryType` logic has no
    # survivors.
    "src/catalog.rs",
    "src/client_context.rs",
    "src/config.rs",
]

# Skip mutants whose full name matches, regardless of which file they are in.
# The name cargo-mutants matches against is the whole line it prints for the
# mutant -- path, function, and replacement -- so a pattern anchored at the
# function name never matches. `^fmt::` was one: it was meant to drop the
# Display/Debug impls and instead matched nothing, leaving 17 unkillable
# `Debug::fmt -> Ok(Default::default())` mutants alive in every sweep.
#
# The pattern has to allow a qualified path because that is what appears in the
# mutant name: this crate writes `impl core::fmt::Debug for T`, so cargo-mutants
# prints `<impl core::fmt::Debug for T>::fmt` and the documented `impl Debug`
# pattern does not match it either. `[a-z:]*` covers `core::fmt::`, `fmt::` and
# the unqualified form, and cannot match a type like `MyDebug`. No backslash
# escapes: the mutation workflow re-applies these entries by grepping this file,
# where TOML string escaping does not apply.
#
# Only `Debug` is listed. Display impls in this crate render error messages that
# tests assert on, so their mutants are killed and belong in the gate.
#
# The two `src/abi.rs` entries are mutants that are *equivalent* in every
# mutation build, so no test can kill them there:
#
# - `uses_unstable_api` is `cfg!(feature = duckdb-1-5)`. Every mutation run
#   enables duckdb-1-5-4 (above, and on the workflow command line), which
#   implies duckdb-1-5, so the function returns `true` in every mutated build
#   and the `-> true` mutant is the same program. Its `-> false` mutant stays in
#   the gate and is killed; `abi::tests::unstable_api_flag_tracks_the_feature`
#   kills `-> true` in the default-feature `cargo test --lib`.
# - `built_against_version` returns `None` whenever QUACK_RS_TARGET_DUCKDB_VERSION
#   was unset at build time (build.rs then emits no QUACK_RS_BUILT_AGAINST_DUCKDB,
#   so `option_env!` is `None`). The crate's own unit test
#   `declared_version_is_none_unless_it_parses` requires exactly that build, so
#   in any build where the suite passes the `-> None` mutant is the same
#   program. The parsing it delegates to, `parse_declared_version`, stays in
#   the gate, as do the `Some(..)` mutants of `built_against_version`, and
#   `built_against_version_is_the_build_scripts_declaration` kills `-> None`
#   in a build that does declare a version.
#
# The entries below are equivalent in the same sense, or (the last) FFI-bound:
#
# - `yaml_quoted`'s `'\r'` arm (src/scaffold/escape.rs). With the arm deleted a
#   carriage return falls through to the `\u000d` escape, which decodes to the
#   same character. The only input that could show the difference in the
#   output is a carriage return, and none reaches the function:
#   `validate_free_text` refuses every control character but tab and newline
#   in the description and maintainer (a bare CR is a hard error in the `//!`
#   doc comment the description also becomes), and the version, the only
#   other quoted field, is validated to ASCII letters, digits and `._+-`. Every
#   configuration `generate_scaffold` accepts produces byte-identical files.
#   The `'\n'` and `'\t'` arms stay in the gate: those characters do reach it,
#   and `description_yml_keeps_free_text_readable` kills their deletion.
# - `MAX_CHILD_CAPACITY_USIZE`'s `MAX_LIST_CHILD_CAPACITY > usize::MAX as u64`
#   (src/vector/list_builder.rs, a const with no enclosing function, hence the
#   `$`-anchored pattern) mutated to `>=` or `==`. 2^37 never equals
#   `usize::MAX` on any target, so `>=` is the same program everywhere; `==` is
#   the same program on every 64-bit target — the condition is false either
#   way — which is every mutation run (it would differ on 32-bit, where the
#   existing `max_capacity_matches_duckdbs_constant` catches it). The `<`
#   mutant stays in the gate and is killed. `vector::ops::MAX_CAPACITY` is
#   defined as this constant, so it has no separate mutants.
# - `with_element_limit`'s `limit < self.ceiling` mutated to `<=`: the two
#   differ only at `limit == self.ceiling`, where both arms store that same
#   value.
# - `CastGuard::accepts`'s `(v < 0) as i64` mutated to `<=` (src/value/
#   temporal_checks.rs, the `FiniteAndNanoDayFits` arm). The two differ only at
#   `v == 0`, where the mutant computes day `(0 + 1) / NANOS_PER_DAY - 1 = -1`
#   instead of 0; `-1 * NANOS_PER_DAY` fits an `i64` as `0 * NANOS_PER_DAY`
#   does and 0 is finite, so `accepts(0)` is `true` either way — and the day is
#   used for nothing else.
# - `ListBuilder::element_count -> 0 / 1` (src/vector/list_builder.rs): the
#   count only advances in `push_row` / `push_map_row` after
#   `ListVector::set_entry`, which calls `duckdb_vector_get_data`, so no unit
#   test without a live engine can make it anything but 0 (the same rationale
#   as the FFI entries in `exclude_globs`). It is checked end to end against a
#   real LIST vector by `list_builder_writes_correct_offsets_across_growth` in
#   tests/ffi_roundtrip.rs; `overflowed`, whose refusal path makes no DuckDB
#   call, stays in the gate.
exclude_re = [
    "impl [a-z:]*Debug for",    # Debug impls: rendering is not behaviour
    "abi.rs.*replace uses_unstable_api -> bool with true",  # equivalent: see above
    "abi.rs.*replace built_against_version -> Option<&'static str> with None",  # equivalent: see above
    "escape.rs.*delete match arm '.r' in yaml_quoted",  # unreachable input: see above
    "list_builder.rs:[0-9]+:[0-9]+: replace > with (==|>=)$",  # equivalent: see above
    "list_builder.rs.*replace < with <= in ListBuilder::with_element_limit",  # equivalent: see above
    "temporal_checks.rs.*replace < with <= in CastGuard::accepts",  # equivalent: see above
    "list_builder.rs.*replace ListBuilder::element_count -> usize with",  # FFI-bound: see above

    # ── FFI-only checks in files that otherwise stay in the gate ────────────
    # Each check below runs only with a DuckDB handle in hand, so a --lib run
    # with no live engine cannot reach it; the rest of its file has pure logic
    # that unit tests do kill, so the file is not excluded.
    #
    # composite.rs: Value::struct_value first reads the field count with
    # duckdb_struct_type_child_count; Value::checked_container inspects the
    # result of duckdb_create_list_value / _array_value and then calls
    # duckdb_get_type_id; Value::map count check needs a LogicalType (only
    # duckdb_create_*_type makes one) and Values to count. Covered end to end
    # in tests/ffi_roundtrip.rs and tests/ffi_roundtrip/value_nested.rs.
    "src/value/composite.rs:.*Value::(struct_value|checked_container|map)( |$)",
    # info.rs: only BindInfo::set_error sets the flag, and it calls
    # duckdb_bind_set_error. The with-true mutant is killed by a unit test;
    # the with-false one by tests/ffi_roundtrip/table_cast.rs.
    "src/table/info.rs:.*replace BindInfo::error_reported -> bool with false",
    # render_guard.rs: Value::renderable and its two helpers read the value's
    # type, payload and children through duckdb_get_* calls. Its pure type
    # predicates stay in the gate. Checked end to end against
    # tests/ffi_roundtrip with a real libduckdb 1.5.5: in the fourth audit,
    # 17 mutants with try_new's below, all caught, 10 by the process aborting
    # as the guard exists to prevent, the rest by value_temporal.rs and
    # value_nested.rs assertions; in the fifth (AUDIT.md 10.8), after the
    # guard became an allow-list, all 17 of this pattern's mutants caught.
    "src/value/render_guard.rs:.*Value::(renderable|temporal_payload_in_range|type_contains_unchecked_payload)( |$)",
    # construct.rs: LogicalType::try_new compares the type id DuckDB created
    # with the one asked for, which needs duckdb_create_logical_type; with the
    # comparison inverted, every type creation fails end to end.
    "src/types/logical_type/construct.rs:.*replace != with == in LogicalType::try_new",
    # error_data.rs: a non-null ErrorData only comes from DuckDB, and
    # is_null / has_error / message / Drop / check_valid_utf8 are only told
    # apart from their mutants with one (duckdb_error_data_* /
    # duckdb_valid_utf8_check); the --lib run reaches them only with a null
    # handle. Killed end to end by tests/ffi_roundtrip and, for Drop,
    # tests/handle_leaks.rs (fifth audit, AUDIT.md 10.8).
    "src/error_data.rs:.*(replace ErrorData::is_null -> bool with true|replace ErrorData::has_error -> bool with false|replace ErrorData::message -> Option<String> with None|replace <impl Drop for ErrorData>::drop with|replace check_valid_utf8 )",
    # export_check.rs: Rules::of builds DuckDB's Arrow schema for three types
    # (duckdb_to_arrow_schema) and check_chunk reads live vectors; both are
    # killed end to end by tests/ffi_roundtrip/arrow_export.rs (AUDIT.md 10.8).
    "src/arrow/export_check.rs:.*(replace == with != in Rules::of$|check_chunk( |$))",
    # Equivalent: capacity_for's `elements > MAX_CHILD_CAPACITY_USIZE as u64`
    # mutated to `>=` or `==` differs only when the two are equal, where both
    # branches return that same value; reservation's `p < limit` mutated to
    # `<=` differs only at `p == limit`, where both arms return `limit`.
    "list_builder.rs:.*replace > with (==|>=) in capacity_for",
    "list_builder.rs:.*replace < with <= in reservation",
]
