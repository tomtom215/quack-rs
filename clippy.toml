#
# Clippy configuration. The lint levels (pedantic, nursery, cargo, and the
# few allowed lints) are set in Cargo.toml [lints.clippy]; this file holds
# per-lint thresholds.
#
# All three values below are clippy's own defaults (clippy_config/src/conf.rs
# at rust-1.99.0: 100, 7, 25), so today this file changes nothing. They are
# written down so that a future clippy changing a default does not silently
# change what this crate is held to; raising one is a decision for review.

# Lines in a function before `too_many_lines` fires (pedantic).
too-many-lines-threshold = 100

# Arguments a function may take before `too_many_arguments` fires.
too-many-arguments-threshold = 7

# Score above which `cognitive_complexity` fires (nursery).
cognitive-complexity-threshold = 25
