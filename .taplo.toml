# SPDX-License-Identifier: MIT
# Formatter/linter configuration for taplo (https://taplo.tamasfe.dev).
#   taplo fmt --check     # as CI would run it
#   taplo lint
# Written to match the TOML already in the repository (four-space indent,
# trailing comments left where the author put them), so adopting it reformats
# nothing.
include = ["*.toml", "*/Cargo.toml", "*/*/Cargo.toml", ".cargo/*.toml"]
# `.cargo/mutants.toml` is a long annotated glob list whose trailing comments are
# aligned by hand; taplo would re-flow all 250 lines of it.
exclude = ["**/target/**", ".cargo/mutants.toml"]

[formatting]
indent_string = "    "
align_comments = false
align_entries = false
array_auto_expand = false
array_auto_collapse = false
reorder_keys = false
column_width = 100
