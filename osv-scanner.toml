# Suppressions for the `Security (OSV / GHSA)` CI job.
#
# Entries here must be justified by *reachability*, not by inconvenience, and
# the osv-scan job re-proves each justification before the scan runs, so a
# suppression cannot outlive the reason it was granted.

# No suppressions are active.
#
# RUSTSEC-2026-0235 (rkyv 0.7.46) was suppressed here until 2026-09-20. It was
# reachable only as quack-rs -> duckdb -> rust_decimal -> rkyv, and the entry
# was written to be removed once that path disappeared. It has: in duckdb
# 1.10505.0 `rust_decimal` became an OPTIONAL dependency (it was required in
# 1.10504.0 -- diffed against the crates.io index for both versions), and
# quack-rs does not enable the feature that turns it on. rust_decimal and rkyv
# are both absent from Cargo.lock, and osv-scanner reads the lockfile, so there
# is nothing left to suppress.
#
# Unrelated but in the same relock: libduckdb-sys 1.10505.0 swapped its
# `reqwest` build-dependency for `ureq`, which is most of why the lockfile lost
# 100 packages net (hyper, tokio, quinn, rustls and their trees). That change
# does not touch rkyv.
#
# The `Confirm the suppressed advisory is still unreachable` step in the
# osv-scan job existed solely to keep that entry honest, and was removed with
# it. Re-add both together if a future suppression is ever needed.
