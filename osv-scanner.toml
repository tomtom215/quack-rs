# Suppressions for the `Security (OSV / GHSA)` CI job.
#
# Entries here must be justified by *reachability*, not by inconvenience, and
# the osv-scan job re-proves each justification before the scan runs, so a
# suppression cannot outlive the reason it was granted.

# Active suppressions
#
# RUSTSEC-2026-0543 (added 2026-11-25): `chrono` is unmaintained; the advisory
# covers every version, so there is no fix to move to. It is reachable only as
# quack-rs -> duckdb -> arrow-* -> chrono, and `duckdb` is an optional dependency
# that only the test features `bundled-test` / `bundled-test-prebuilt` enable.
# With the default or any `duckdb-1-5*` feature chrono is not in the graph, so no
# extension built with quack-rs links it; fuzz/ and book/doctest/ are CI-only
# crates on the same test dependency. `arrow` itself depends on chrono, so no
# version bump removes it. The osv-scan job's step `Confirm the suppressed
# advisories are still test-only` re-proves this before every scan and fails
# when it stops being true (or when chrono leaves the test graph, so the entry
# is removed rather than left to rot). deny.toml and deny.ci-crates.toml carry
# the same entry for cargo-deny.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "chrono is unmaintained (no fixed release); reached only through the optional test-only duckdb -> arrow dependency; re-proved by CI before each scan"

# Earlier suppressions
#
# RUSTSEC-2026-0235 (rkyv 0.7.46) was suppressed here until 2026-09-20. It was
# reachable only as quack-rs -> duckdb -> rust_decimal -> rkyv, and the entry
# was written to be removed once that path disappeared. It has: in duckdb
# 1.10505.0 `rust_decimal` became an OPTIONAL dependency (it was required in
# 1.10504.0 -- diffed against the crates.io index for both versions), and
# quack-rs does not enable the feature that turns it on. rust_decimal and rkyv
# are both absent from Cargo.lock, and osv-scanner reads the lockfile, so there
# is nothing left to suppress.
#
# Unrelated but in the same relock: libduckdb-sys 1.10505.0 swapped its
# `reqwest` build-dependency for `ureq`, which is most of why the lockfile lost
# 100 packages net (hyper, tokio, quinn, rustls and their trees). That change
# does not touch rkyv.
#
# Its `Confirm the suppressed advisory is still unreachable` step was removed
# with it; RUSTSEC-2026-0543 brought the step back in the same shape.
