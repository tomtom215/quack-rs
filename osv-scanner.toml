# Suppressions for the `Security (OSV / GHSA)` CI job.
#
# Entries here must be justified by *reachability*, not by inconvenience, and
# any suppression has to carry the evidence for its own justification, so it
# cannot outlive the reason it was granted.
#
# There are currently none.
#
# The last one suppressed RUSTSEC-2026-0235 (rkyv 0.7.46). rkyv reached the
# lockfile only as an unenabled optional feature of rust_decimal, which was
# itself pulled in by `duckdb`; osv-scanner reads the lockfile rather than the
# build graph, so it reported a crate no build of this project ever linked.
# DuckDB 1.10505.0 dropped its `rust_decimal` dependency, which removed both
# crates from the lockfile outright — so the advisory is now unreportable and
# suppressing it would be meaningless. The CI step that re-proved the old
# justification went with it: with no suppression in place, osv-scanner fails
# the job by itself if rkyv ever returns.
