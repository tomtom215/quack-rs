#
# Test coverage — generates an LCOV report and uploads to Codecov.
#
# Runs on pushes to main and PRs. Uses cargo-llvm-cov for accurate
# source-based coverage instrumentation (no sampling, no heuristics).

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    # `--all-features` compiles DuckDB from C++; the default limit is 360 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-08
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-llvm-cov --locked --version "0.9.1"

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
