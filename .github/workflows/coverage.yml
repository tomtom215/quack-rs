#
# Test coverage — generates an LCOV report and uploads to Codecov.
#
# Runs on every push to main, and on a pull request that changes something the
# coverage run builds or measures (`changes` below decides). Uses cargo-llvm-cov
# for accurate source-based coverage instrumentation (no sampling, no
# heuristics).

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # As in ci.yml and release.yml: retry cargo's network operations and use
  # HTTP/1.1, which sidesteps the "[16] Error in the HTTP2 framing layer"
  # failures seen fetching the duckdb+arrow tree.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # Whether a pull request touches anything `cargo llvm-cov --all-targets
  # --all-features` builds or measures. A pull request that changes only the
  # book, other workflows, scripts or hello-ext compiled DuckDB from C++ here
  # for a report that could not differ from main's. The skip is per job, not a
  # workflow `paths:` filter: a skipped job counts as passing if this check is
  # ever made required, where a workflow that never starts leaves a required
  # check "expected" forever. Fail-safe: if this job fails, coverage runs anyway.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did the pull request change a file coverage depends on?
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # `git diff` on its own line, so its failure fails this step (and
          # coverage then runs regardless) instead of reading as "no change".
          # `:(glob)` so `*` does not cross `/`: only the crate's own
          # examples/*.rs, not examples/hello-ext (a separate workspace).
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            src tests benches ':(glob)examples/*.rs' build.rs Cargo.toml Cargo.lock \
            .cargo rust-toolchain.toml codecov.yml .github/workflows/coverage.yml)
          if [ -n "$changed" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            printf 'Coverage runs; changed:\n%s\n' "$changed"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing coverage builds or measures changed; the coverage job is skipped."
          fi

  coverage:
    name: Test coverage
    needs: changes
    # Pushes to main always run (changes is skipped there). On a pull request,
    # skip only when change detection succeeded and found nothing relevant.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-24.04
    # `--all-features` compiles DuckDB from C++; the default limit is 360 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-llvm-cov --locked --version "0.9.1"

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
