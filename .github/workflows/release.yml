# Copyright 2026 Tom F.
#
# Release pipeline for quack-rs
#
# Triggered by pushing a semver tag (e.g. `git tag -s v0.3.0 && git push origin v0.3.0`).
# See RELEASING.md for the complete release runbook.
#
# Job dependency graph:
#
#   validate ──► ci (the whole of ci.yml) ──► package ──► publish ──► github-release ──► docs
#                                                       (crates-io env)
#
# `ci` runs ci.yml itself (workflow_call), so a release passes every gate a
# pull request does — semver, Miri, the sanitizers, extension-load on every
# pinned DuckDB — rather than a hand-copied subset that drifts.
#
# The GitHub release is created only after crates.io has the crate, so a
# rejected crates-io approval leaves no public release for a version that
# was never published.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # stable:     v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # pre-release: v1.2.3-alpha.1

# Prevent concurrent releases for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal default — individual jobs escalate only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # Harden against transient crates.io/CDN download flakes — notably
  # "[16] Error in the HTTP2 framing layer" when fetching the duckdb+arrow tree.
  # Retry network ops and force HTTP/1.1 (disabling HTTP/2 multiplexing sidesteps
  # the HTTP/2 framing errors). Child cargo invocations inherit these too.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# ── Job 1: Validate tag & extract metadata ────────────────────────────────────
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version:       ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      crate_name:    ${{ steps.meta.outputs.crate_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # RELEASING.md tags releases with `git tag -s` from main. Nothing checked
      # either: a lightweight tag, or a tag on a commit that never reached
      # main, got a package, an attestation and a GitHub release. The tagged
      # commit must be on main so that what is released is what was reviewed.
      # (This file runs from the tagged tree, so a repository rule restricting
      # who may create `v*` tags is the control against an edited workflow.)
      - name: Tag is annotated and on main
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "::error::Tag '$TAG' is a lightweight tag. Release tags are annotated and signed: git tag -s '$TAG' -m 'Release $TAG' (RELEASING.md Step 5)."
            exit 1
          fi
          git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Merge the release commit to main and tag it there."
            exit 1
          fi
          echo "::notice::Tag $TAG is annotated and points at a commit on main."

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "::group::Tag metadata"
          printf 'Tag:        %s\n' "$TAG"
          printf 'Version:    %s\n' "$VERSION"

          # Validate semver (X.Y.Z with optional pre-release and build metadata)
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\+[A-Za-z0-9.]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Tag '$TAG' is not a valid semantic version."
            echo "Expected format: vX.Y.Z  or  vX.Y.Z-pre.1"
            exit 1
          fi

          # Detect pre-release (contains a hyphen after X.Y.Z)
          if [[ "$VERSION" =~ - ]]; then
            IS_PRE=true
          else
            IS_PRE=false
          fi

          CRATE_NAME=$(grep '^name = ' Cargo.toml | head -1 | sed 's/name = "\(.*\)"/\1/')

          printf 'Crate:      %s\n' "$CRATE_NAME"
          printf 'Pre-release:%s\n' "$IS_PRE"
          echo "::endgroup::"

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE"  >> "$GITHUB_OUTPUT"
          echo "crate_name=$CRATE_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        shell: bash
        env:
          TAG_VER: ${{ steps.meta.outputs.version }}
        run: |
          CARGO_VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          echo "::group::Version consistency"
          printf 'Cargo.toml: %s\n' "$CARGO_VER"
          printf 'Tag:        %s\n' "$TAG_VER"
          echo "::endgroup::"

          if [[ "$CARGO_VER" != "$TAG_VER" ]]; then
            echo "::error file=Cargo.toml::Cargo.toml version ($CARGO_VER) != tag ($TAG_VER)."
            echo "Update Cargo.toml to match the tag before releasing."
            exit 1
          fi
          echo "::notice::Cargo.toml and tag versions agree: $CARGO_VER"

      - name: Verify CHANGELOG entry exists
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # `.` and `+` in a version are regex metacharacters; match literally,
          # and require the dated heading RELEASING.md Step 2 writes.
          if ! grep -qF "## [$VERSION] - " CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No dated '## [$VERSION] - YYYY-MM-DD' entry in CHANGELOG.md."
            echo "Add release notes before tagging."
            exit 1
          fi
          echo "::notice::CHANGELOG.md entry found for v$VERSION"

# ── Job 2: Every CI gate, by running ci.yml itself ──────────────────────────
  ci:
    name: CI
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

# ── Job 3: Package crate and generate provenance ─────────────────────────────
  package:
    name: Package and attest
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write      # OIDC token for SLSA attestation
      attestations: write  # write attestation to the repository
    outputs:
      crate_file: ${{ steps.pkg.outputs.crate_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      # No cache in this job or in `publish`: a tag-triggered run can restore
      # caches the default branch saved, and this job holds the attestation
      # token. Release speed does not matter.

      - name: cargo package
        id: pkg
        shell: bash
        run: |
          echo "::group::Package contents (files included in .crate)"
          cargo package --list --no-verify --locked
          echo "::endgroup::"

          echo "::group::Build .crate archive"
          cargo package --no-verify --locked
          echo "::endgroup::"

          CRATE_FILE=$(ls target/package/*.crate)
          CRATE_SIZE=$(wc -c < "$CRATE_FILE")
          echo "crate_file=$CRATE_FILE" >> "$GITHUB_OUTPUT"
          printf '::notice::Packaged %s (%s bytes)\n' "$(basename "$CRATE_FILE")" "$CRATE_SIZE"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd target/package
          sha256sum ./*.crate | tee SHA256SUMS
          echo "::notice::SHA-256 checksums written to SHA256SUMS"

      # SLSA Level 2 build provenance — creates a signed attestation linking
      # the .crate artifact to this workflow run, verifiable with `gh attestation verify`.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            target/package/*.crate
            target/package/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

# ── Job 5: Create GitHub release with artifacts & release notes ───────────────
  github-release:
    name: Create GitHub release
    needs: [validate, package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # create release, upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts/

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          echo "::group::Extracting release notes for v$VERSION"

          # Extract everything between ## [VERSION] and the next ## [ heading
          # index(), not a regex: `.` and `+` in the version are literal.
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "::error::Empty release notes extracted for $VERSION"
            echo "Ensure CHANGELOG.md has a non-empty ## [$VERSION] section."
            exit 1
          fi

          # GitHub refuses a release body over 125,000 characters (HTTP 422,
          # "body is too long"); the 0.18.0 section was 125,495 and failed the
          # first release run at this step. Past the limit, post the section's
          # introduction (everything before its first `### ` heading) and link
          # to the full section in CHANGELOG.md at this tag. Characters, not
          # bytes, are what GitHub counts, hence Python rather than `wc -c`.
          python3 scripts/release-notes-fit.py release_notes.md \
            "https://github.com/${REPO}/blob/v${VERSION}/CHANGELOG.md"

          echo "Release notes preview:"
          cat release_notes.md
          echo "::endgroup::"

      - name: List release artifacts
        shell: bash
        run: |
          echo "::group::Artifacts to attach"
          ls -lh release-artifacts/
          echo "::endgroup::"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRE: ${{ needs.validate.outputs.is_prerelease }}
          CRATE: ${{ needs.validate.outputs.crate_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="v${VERSION}"

          PRE_FLAG=""
          [[ "$IS_PRE" == "true" ]] && PRE_FLAG="--prerelease"

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # Idempotent: if a release already exists (e.g. created by GitHub
          # Desktop or the web UI when pushing a tag), update it in place
          # instead of failing.
          if gh release view "$TAG" &>/dev/null; then
            echo "::warning::Release ${TAG} already exists — updating it."
            echo "::group::Updating GitHub release ${TAG}"
            gh release edit "$TAG" \
              $PRE_FLAG \
              --title "${CRATE} ${TAG}" \
              --notes-file release_notes.md

            # Upload assets (--clobber overwrites if they already exist)
            gh release upload "$TAG" \
              --clobber \
              release-artifacts/*.crate \
              release-artifacts/SHA256SUMS
            echo "::endgroup::"
            echo "::notice::GitHub release updated: $RELEASE_URL"
          else
            echo "::group::Creating GitHub release ${TAG}"
            # --verify-tag: without it gh creates a missing tag at the
            # default branch's HEAD instead of failing.
            gh release create "$TAG" --verify-tag \
              $PRE_FLAG \
              --title "${CRATE} ${TAG}" \
              --notes-file release_notes.md \
              release-artifacts/*.crate \
              release-artifacts/SHA256SUMS
            echo "::endgroup::"
            echo "::notice::GitHub release created: $RELEASE_URL"
          fi

          # ── Step summary ──────────────────────────────────────────────────
          {
            echo "## Release v${VERSION} created"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Pre-release | \`${IS_PRE}\` |"
            echo "| Crate | \`${CRATE}\` |"
            echo "| GitHub Release | [v${VERSION}](${RELEASE_URL}) |"
            echo ""
            echo "### Artifacts"
            echo "\`\`\`"
            ls -lh release-artifacts/
            echo "\`\`\`"
            echo ""
            echo "The crate is already on crates.io: the publish job runs first."
          } >> "$GITHUB_STEP_SUMMARY"

# ── Job 4: Publish to crates.io (protected environment, requires approval) ────
  publish:
    name: Publish to crates.io
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The 'crates-io' environment requires a manual approval step.
    # Configure it at: Settings → Environments → crates-io → Required reviewers
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.validate.outputs.crate_name }}
    permissions:
      contents: read
      id-token: write  # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable

      # Preferred credential: crates.io Trusted Publishing, which exchanges
      # this job's OIDC token for a short-lived crates.io token (revoked when
      # the job ends), scoped by the trusted-publisher configuration on
      # crates.io: this repository, this workflow file, the `crates-io`
      # environment. One-time setup: RELEASING.md, Prerequisites.
      # `continue-on-error` makes the CARGO_REGISTRY_TOKEN fallback reachable
      # until that setup is done; the next step refuses to run with neither.
      - name: Obtain a crates.io token via Trusted Publishing
        id: trusted
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          TRUSTED_TOKEN: ${{ steps.trusted.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          CRATE: ${{ needs.validate.outputs.crate_name }}
        shell: bash
        run: |
          if [[ -n "$TRUSTED_TOKEN" ]]; then
            echo "Publishing with a Trusted Publishing token."
            export CARGO_REGISTRY_TOKEN="$TRUSTED_TOKEN"
          elif [[ -n "$FALLBACK_TOKEN" ]]; then
            echo "::warning::Trusted Publishing is not configured (or the exchange failed); using the CARGO_REGISTRY_TOKEN secret. See RELEASING.md, Prerequisites."
            export CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN"
          else
            echo "::error::No crates.io credential: configure Trusted Publishing or the CARGO_REGISTRY_TOKEN secret (RELEASING.md, Prerequisites)."
            exit 1
          fi

          echo "::group::cargo publish — $CRATE v$VERSION"
          # --no-verify: ci.yml's publish-dry-run job already built this exact
          # commit from its packaged sources. Verifying again here would run
          # every dependency's build script with the token in the environment.
          # Idempotent: if a re-run publishes the same version that's
          # already on crates.io, treat it as success rather than failing.
          if ! cargo publish --locked --no-verify 2>&1 | tee /tmp/publish.log; then
            # cargo checks the index first ("already exists on crates.io
            # index"); older cargo failed later at upload ("already uploaded").
            if grep -qE "already exists on|already uploaded" /tmp/publish.log; then
              echo "::warning::$CRATE v$VERSION is already published — skipping."
            else
              echo "::error::cargo publish failed"
              exit 1
            fi
          fi
          echo "::endgroup::"
          unset CARGO_REGISTRY_TOKEN

          CRATES_URL="https://crates.io/crates/${CRATE}/${VERSION}"
          DOCS_URL="https://docs.rs/${CRATE}/${VERSION}"
          echo "::notice::Published $CRATE v$VERSION to crates.io"

          # ── Step summary ──────────────────────────────────────────────────
          {
            echo "## Published to crates.io"
            echo ""
            echo "| Link | URL |"
            echo "|------|-----|"
            echo "| crates.io | [${CRATE} v${VERSION}](${CRATES_URL}) |"
            echo "| docs.rs   | [${CRATE} v${VERSION}](${DOCS_URL}) |"
            echo ""
            echo "> docs.rs may take a few minutes to build and index the documentation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the attested artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts/

      # The attestation and SHA256SUMS describe the `.crate` the `package` job
      # built; crates.io serves the one `cargo publish` just built. `cargo
      # package` is reproducible (crates.io's 0.18.0 is byte-identical to a
      # local `cargo package` of the v0.18.0 tag), so the two must match; a
      # difference means the attestation does not describe what users get.
      - name: crates.io serves the attested .crate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CRATE: ${{ needs.validate.outputs.crate_name }}
        shell: bash
        run: |
          FILE="${CRATE}-${VERSION}.crate"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -A "quack-rs release check" -o "/tmp/$FILE" \
                "https://static.crates.io/crates/${CRATE}/${FILE}"; then
              break
            fi
            echo "crates.io does not serve $FILE yet (attempt $attempt); retrying in 20s"
            sleep 20
          done
          test -s "/tmp/$FILE" || { echo "::error::could not download $FILE from crates.io"; exit 1; }
          want=$(awk -v f="$FILE" '$2 == f || $2 == "./" f { print $1 }' release-artifacts/SHA256SUMS)
          got=$(sha256sum "/tmp/$FILE" | awk '{ print $1 }')
          echo "attested:  $want"
          echo "crates.io: $got"
          if [[ -z "$want" || "$want" != "$got" ]]; then
            echo "::error::crates.io's $FILE does not match the attested artifact."
            exit 1
          fi
          echo "::notice::crates.io serves the attested $FILE (sha256 $got)."

# ── Job 6: Publish the release's book (quack-rs.com/ and /vX.Y/) ──────────────
  docs:
    name: Deploy the versioned book
    needs: [validate, github-release]
    # A prerelease gets no book of its own (scripts/build-versioned-site.py
    # skips prerelease tags); main's /dev/ already shows it.
    if: needs.validate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # docs.yml rebuilds every version from the tags. It runs on main, not
      # on this tag, because the github-pages environment only deploys main.
      - name: Dispatch docs.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run docs.yml --repo "$REPO" --ref main
          echo "::notice::Dispatched docs.yml on main; the book for this release appears at https://quack-rs.com/ when it finishes."
