#
# Benchmark suite — runs criterion benchmarks and archives results.
#
# Trigger: on-demand (workflow_dispatch) and pushes to main when
# benchmark or source code changes.

name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "benches/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  bench:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build benchmarks
        run: cargo bench --no-run

      - name: Run interval benchmarks
        run: cargo bench --bench interval_bench

      - name: Write summary
        run: |
          {
            echo "## Benchmark run completed"
            echo ""
            echo "Criterion HTML reports are available in the uploaded artifact."
            echo ""
            echo "To compare locally:"
            echo '```bash'
            echo "cargo bench --bench interval_bench"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload criterion reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 30
