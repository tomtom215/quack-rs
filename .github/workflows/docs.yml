# Documentation deployment — builds mdBook and deploys to GitHub Pages.

name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo registry and mdBook binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}

      - name: Install mdBook
        run: |
          if ! command -v mdbook &>/dev/null; then
            echo "Installing mdBook ${{ env.MDBOOK_VERSION }}..."
            cargo install mdbook --locked --version "${{ env.MDBOOK_VERSION }}"
          else
            echo "mdBook $(mdbook --version) already cached."
          fi

      - name: Generate sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Build documentation
        run: mdbook build

      - name: Write build summary
        run: |
          PAGE_COUNT=$(find book/book -name '*.html' | wc -l)
          {
            echo "## Documentation built successfully"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| mdBook version | \`${{ env.MDBOOK_VERSION }}\` |"
            echo "| HTML pages generated | \`${PAGE_COUNT}\` |"
            echo "| Output directory | \`book/book/\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Write deploy summary
        run: |
          {
            echo "## Documentation deployed"
            echo ""
            echo "Live at: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
