# Copyright 2026 Tom F.
#
# Documentation deployment — builds the versioned mdBook site and deploys it
# to GitHub Pages (quack-rs.com).
#
# The site holds one book per release line plus main (see
# scripts/build-versioned-site.py for the layout): / is the latest release,
# /vX.Y/ each release line, /dev/ the main branch with its rustdoc under
# /dev/api/. Every deploy rebuilds all of it from the git tags, so the output
# depends only on the tags and main, and there is no gh-pages branch to drift.
#
# A push to main redeploys /dev/. A release redeploys / and adds /vX.Y/:
# release.yml's last job dispatches this workflow on main once the crate is
# on crates.io (a tag-triggered run would be refused by the github-pages
# environment's branch policy, and the release commit's own main push ran
# before its tag existed).

name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job needs to write Pages; the build job runs repository
# code (cargo doc, the site builder) and gets a read-only token.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build versioned site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag: each release line's book is built from its tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: 1.99.1

      # main's API reference for /dev/api/, with the docs.rs feature set
      # (Cargo.toml [package.metadata.docs.rs]). Released versions link to
      # docs.rs instead.
      - name: Build API documentation (main)
        run: cargo doc --no-deps --features duckdb-1-5-4
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Downloads each mdBook version the books pin (book/mdbook-version;
      # 0.4.40 for tags that predate the file), checked against the sha256
      # in the script, then builds, post-processes and checks the site.
      - name: Build versioned site
        run: python3 scripts/build-versioned-site.py --out site --dev-api target/doc

      - name: Write build summary
        run: |
          {
            echo "## Documentation built"
            echo ""
            echo '```json'
            cat site/versions.json
            echo '```'
            echo ""
            echo "HTML pages: $(find site -name '*.html' | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Write deploy summary
        run: |
          {
            echo "## Documentation deployed"
            echo ""
            echo "Live at: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
