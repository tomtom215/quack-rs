#
# Mutation testing — verifies that tests actually detect code changes.
#
# Runs cargo-mutants on library source and fails if any mutant survives.
# On-demand via workflow_dispatch; also runs incrementally on PRs.

name: Mutation Testing

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

# This workflow builds and executes code from pull requests and never writes
# anything back to GitHub, so it gets the minimum token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Full mutation sweep (on-demand) ──────────────────────────────────────
  mutants-full:
    name: "Mutants (full sweep)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-mutants --locked --version "27.1.0"

      - name: Run mutation tests
        id: mutants
        run: |
          echo "::group::cargo-mutants execution log"

          # `--output` names the PARENT directory: cargo-mutants writes its
          # results to `<output>/mutants.out/`. Passing `mutants.out` put them
          # in `mutants.out/mutants.out/`, where the report step below never
          # looked -- so every count read 0, the score printed 100%, and the
          # job passed green no matter how many mutants survived.
          set +e
          cargo mutants \
            --output . \
            --timeout 120 \
            --jobs 4 2>&1 | tee /tmp/mutants-run.log
          # `${PIPESTATUS[0]}`, not `$?`: these steps run under the default
          # shell (`bash -e`, no `pipefail`), so `$?` after a pipeline is
          # `tee`'s status -- always 0 -- and never cargo-mutants'.
          MUTANTS_EXIT=${PIPESTATUS[0]}
          set -e

          echo "::endgroup::"
          echo "exit_code=${MUTANTS_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Generate report
        if: always()
        env:
          # The gate reads cargo-mutants' exit code, not just the outcome
          # files: a run whose tests already fail in the UNMUTATED tree (exit 4)
          # writes four empty files, which used to score "100%" and pass.
          MUTANTS_EXIT: ${{ steps.mutants.outputs.exit_code }}
        run: scripts/mutants-report.sh full mutants.out

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutants.out/
            /tmp/mutants-run.log
          retention-days: 30

  # ── Incremental mutation testing (PRs only) ──────────────────────────────
  mutants-incremental:
    name: "Mutation Testing (incremental)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-mutants --locked --version "27.1.0"

      - name: Determine changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Filter to .rs in the shell rather than with a `src/**/*.rs`
          # pathspec: git's default wildmatch lets `*` cross `/`, so that
          # pattern requires at least one directory component after `src/` and
          # silently matches NO top-level file. `src/value.rs`, `src/query.rs`,
          # `src/arrow.rs` and every other module directly under `src/` were
          # skipped entirely, with the job still reporting success.
          # `|| true` because `grep` exits 1 on no match, and this step runs
          # under `bash -e`: a PR that touches no Rust file must reach the
          # `skip=true` branch below, not abort here.
          FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'src/' \
            | grep '\.rs$' | sort -u || true)
          FILE_COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)

          if [ -z "$FILES" ] || [ "$FILE_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Rust source files changed in src/ — mutation testing will be skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "files=$(printf '%s\n' "$FILES" | tr '\n' ',')" >> "$GITHUB_OUTPUT"
            echo ""
            echo "Changed files (${FILE_COUNT}):"
            printf '%s\n' "$FILES" | sed 's/^/  /'
          fi

      - name: Run mutation tests on changed files
        id: mutants
        if: steps.changed.outputs.skip == 'false'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "::group::cargo-mutants execution log"

          # `--file` for each changed source file.
          # CHANGED_FILES arrives through `env:`, NOT through workflow
          # expression interpolation. An interpolated value is substituted into
          # the script before bash parses it, so a PR adding `src/x$(...).rs`
          # would execute that on the runner. Git does not quote `$`, a
          # backtick, `;` or `&` in a path.
          IFS=',' read -ra CHANGED <<< "$CHANGED_FILES"
          ARGS=()
          for f in "${CHANGED[@]}"; do
            [ -n "$f" ] && ARGS+=(--file "$f")
          done

          # Re-apply .cargo/mutants.toml `exclude_globs` as CLI `--exclude` flags.
          # `--file` bypasses config excludes, so without this an edit to an
          # excluded module (test helper / FFI wrapper) gets mutated and reports
          # unkillable "missed" mutants. .cargo/mutants.toml stays the single source of
          # truth; `--exclude` wins over `--file` for the same path.
          while IFS= read -r glob; do
            [ -n "$glob" ] && ARGS+=(--exclude "$glob")
          done < <(sed -n '/^exclude_globs = \[/,/^]/p' .cargo/mutants.toml | grep -oE '"[^"]+"' | tr -d '"')

          # Same for `exclude_re`. cargo-mutants only *combines* a CLI
          # `--exclude-re` with the config file from 27.0.0 onwards; before
          # that the flag replaced the config list outright. This job passes
          # one below, so re-applying the config entries here keeps
          # .cargo/mutants.toml authoritative on either side of that change.
          while IFS= read -r re; do
            [ -n "$re" ] && ARGS+=(--exclude-re "$re")
          done < <(sed -n '/^exclude_re = \[/,/^]/p' .cargo/mutants.toml | grep -oE '"[^"]+"' | tr -d '"')

          # `--features duckdb-1-5-4` is explicit as well as in .cargo/mutants.toml:
          # until the config moved there (Sept 2026) cargo-mutants never read it,
          # and the flag keeps the job correct if it moves again. Without it the
          # duckdb-1-5-gated code (type_id's 1.5 type arms, the whole error_data
          # module, the arrow bridge) is cfg'd out — its mutations would be
          # inert and reported as false "missed".
          #
          # `--cargo-arg=--lib` kills mutants with FAST, deterministic *unit*
          # tests: the bundled-DuckDB integration suite is slow, and run
          # per-mutant under --jobs its contention misclassifies caught mutants.
          # `--exclude-re ErrorData` drops the error_data FFI methods (ErrorData /
          # check_valid_utf8) that need a live runtime; the pure DuckDbErrorType
          # logic stays mutation-tested.
          # `--output` names the PARENT directory: cargo-mutants writes its
          # results to `<output>/mutants.out/`. Passing `mutants.out` put them
          # in `mutants.out/mutants.out/`, where the report step below never
          # looked -- so every count read 0, the score printed 100%, and the
          # job passed green no matter how many mutants survived.
          set +e
          cargo mutants "${ARGS[@]}" \
            --features duckdb-1-5-4 \
            --cargo-arg=--lib \
            --exclude-re 'ErrorData' \
            --output . \
            --timeout 120 \
            --jobs 4 2>&1 | tee /tmp/mutants-run.log
          # `${PIPESTATUS[0]}`, not `$?`: these steps run under the default
          # shell (`bash -e`, no `pipefail`), so `$?` after a pipeline is
          # `tee`'s status -- always 0 -- and never cargo-mutants'.
          MUTANTS_EXIT=${PIPESTATUS[0]}
          set -e

          echo "::endgroup::"
          echo "exit_code=${MUTANTS_EXIT}" >> "$GITHUB_OUTPUT"

      - name: No source changes to mutate
        if: steps.changed.outputs.skip == 'true'
        run: |
          echo "# Mutation Testing — Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No Rust source files changed in \`src/\` — nothing to mutate." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate mutation report
        if: always() && steps.changed.outputs.skip == 'false'
        env:
          # See the full-sweep job: exit codes other than 0/2/3, and a run that
          # generated mutants but tested none, fail the gate.
          MUTANTS_EXIT: ${{ steps.mutants.outputs.exit_code }}
        run: scripts/mutants-report.sh incremental mutants.out

      - name: Upload mutation report
        if: always() && steps.changed.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-incremental
          path: |
            mutants.out/
            /tmp/mutants-run.log
          retention-days: 14
