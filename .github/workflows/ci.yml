# SPDX-License-Identifier: MIT
# Copyright 2026 Tom F.
#
# Continuous integration — enforces all quality gates.
#
# Jobs: check, test, test-bundled, test-bundled-prebuilt, test-older-engines,
#       test-duckdb-2-0, test-bundled-duckdb-2-0, test-duckdb-1-5,
#       wasm, clippy, clippy-beta, fmt, doc, msrv, dependency-floor,
#       bench-compile, example-check, scaffold-compile, symbol-check,
#       abi-table, platform-table, spdx-list, autoload-entries, book,
#       msrv-vs-duckdb-ci, extension-load, scaffold-e2e, abi-guard,
#       abi-guard-layout, publish-dry-run, security, osv-scan, nightly, miri,
#       leak-check, asan, semver, fuzz, workflow-lint, ci-ok (the aggregate
#       required check).
#
# `dtolnay/rust-toolchain` is pinned, in every workflow, to e2a55d2 -- a commit
# on the action's `master` branch (2026-10-08; it moved action inputs into
# environment variables, upstream #187). The action's per-toolchain
# branches (`stable`, `nightly`, ...) are regenerated, so a commit taken from
# one of them stops being reachable from any ref and can be garbage-collected;
# the previous pin, 631a55b, was such a commit. On `master` the `toolchain:`
# input is required, so every use states it. The pin fixes the action's code,
# not the Rust version: `toolchain: stable` still installs the current stable.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Weekly, on the default branch: the abi-table, platform-table, spdx-list and
  # autoload-entries jobs compare the checked-in tables with upstream, which
  # changes without any commit here (a new DuckDB release, a new SPDX list),
  # and clippy-beta / nightly track moving toolchains.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # release.yml runs this whole workflow as its CI gate, so a release passes
  # exactly the checks a pull request does.
  workflow_call:

# CI builds and executes code from pull requests (cargo test, cargo fuzz, the
# scaffold end-to-end job) and never writes anything back to GitHub, so it gets
# the minimum token rather than inheriting the repository default.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR — saves CI minutes when
# multiple commits are pushed in quick succession.  Main-branch pushes
# are NOT cancelled so merge builds always complete.
#
# The group starts with a literal `ci-`, not `github.workflow`: when
# release.yml calls this workflow, `github.workflow` is "Release", and
# GitHub compares group names case-insensitively, so `Release-<tag>` would
# collide with release.yml's own `release-<tag>` group and wait on itself.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # On a tag (a release, which reaches this file through workflow_call) the
  # upstream-comparison guards (scripts/upstream-guard.sh) fail instead of
  # skipping when upstream cannot be reached.
  QUACK_STRICT_UPSTREAM: ${{ github.ref_type == 'tag' && '1' || '' }}
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # Harden against transient crates.io/CDN download flakes — notably
  # "[16] Error in the HTTP2 framing layer" when fetching the duckdb+arrow tree.
  # Retry network ops and force HTTP/1.1 (disabling HTTP/2 multiplexing sidesteps
  # the HTTP/2 framing errors). Child cargo invocations inherit these too.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-targets
      # Every other job builds tests in debug or with the repository's release
      # profile (one codegen unit, fat LTO). A user's crate usually has Cargo's
      # default release profile: 16 codegen units, no fat LTO, where rustc gives
      # each codegen unit its own copy of a constant. `FfiState` salted its tag
      # with such a constant's address, so its callbacks disagreed on the tag
      # and every aggregate state was lost; four existing unit tests fail that
      # way, and only this build runs them so.
      - name: Unit tests with 16 codegen units and no fat LTO
        run: cargo test --release --lib --features duckdb-1-5-4
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
      # `--all-targets` expands to --lib --bins --tests --benches --examples,
      # which EXCLUDES doctests. Without this step the ~200 examples in the
      # rustdoc were never compiled by CI -- and for an SDK the rustdoc is the
      # product. Linux only: doctests are platform-independent here.
      - if: runner.os == 'Linux'
        run: cargo test --doc --features duckdb-1-5-4

  test-bundled:
    name: Test bundled-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --no-fail-fast: cargo otherwise stops at the first failing test
      # binary, hiding failures in the ones after it.
      - run: cargo test --all-targets --features bundled-test --no-fail-fast
      # The release workflow's `test · <OS>` command. Without it, nothing ran
      # the `duckdb-1-5*` tests against a real DuckDB on macOS or Windows
      # before a tag, and v0.18.0's first tag failed on Windows while main was
      # green (LESSONS.md, "Why macOS looked different", is the first time this
      # happened). The extra quack-rs features leave the duckdb/libduckdb-sys
      # features unchanged, so the DuckDB built by the step above is reused.
      - name: Test --all-features (as release.yml does)
        if: ${{ !cancelled() }}
        run: cargo test --all-targets --all-features --no-fail-fast
      # The release workflow's `doc` job: the only rustdoc pass over the
      # `_duckdb-testing` items (`testing::InMemoryDb`).
      - name: Doc --all-features (as release.yml does)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Exercises the `bundled-test-prebuilt` path: link a pre-built libduckdb
  # instead of compiling DuckDB from C++ source. Combined with duckdb-1-5-4 this
  # is also the only job that runs the DuckDB 1.5.x FFI wrapper tests (appender,
  # selection_vector, instance_cache, ...) against a real DuckDB runtime.
  # Linux only — the pre-built release archive is published per-platform.
  test-bundled-prebuilt:
    name: Test bundled-test-prebuilt (prebuilt libduckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download pre-built libduckdb
        # The version is DERIVED from Cargo.lock, not written here. It used to
        # be hard-coded with a comment asking the next person to keep it in
        # sync with libduckdb-sys; a lockfile bump silently left CI linking a
        # libduckdb one release older than the bindings it was generating.
        # scripts/fetch-duckdb.sh picks the release's asset (1.x and 2.x name
        # them differently); the test shim is generated from the
        # duckdb_extension.h both ship (build.rs).
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "${{ runner.temp }}/libduckdb"
      - name: Test against pre-built libduckdb
        env:
          # DUCKDB_LIB_DIR resolves headers + link search; LD_LIBRARY_PATH lets the
          # test binary find libduckdb.so at run time (the link-time rpath emitted
          # by libduckdb-sys does not propagate to this downstream test binary).
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo test --all-targets --features bundled-test-prebuilt,duckdb-1-5-4
      # Every Rust block in book/src and README.md, compiled as a doctest
      # against this checkout (and run, unless marked `no_run`). Before this,
      # no CI job compiled the book's examples. (`mdbook test -L target/...`
      # is not a substitute: it passes no `--extern`, so under edition 2021
      # every `use quack_rs::...` is unresolved.)
      - name: Book and README code blocks
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo test --doc --manifest-path book/doctest/Cargo.toml
      # `tests/ffi_roundtrip.rs` is `#![cfg(feature = "_duckdb-testing")]`, so
      # the plain `clippy` job compiles it away to nothing and never lints the
      # largest test file in the repo. Lint it where it is actually built.
      #
      # The env block is repeated rather than shared: `build.rs` needs
      # DUCKDB_LIB_DIR to find `duckdb.hpp` for the C++ shim on *every*
      # invocation, clippy included, and a step without it panics in the build
      # script before clippy ever runs.
      - name: Clippy (including the end-to-end tests)
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo clippy --all-targets --features bundled-test-prebuilt,duckdb-1-5-4 -- -D warnings

  test-older-engines:
    # Every other test job runs against the DuckDB release Cargo.lock pins
    # (v1.5.6), but quack-rs supports every release from v1.4.4, and a
    # `duckdb-1-5` build loads into v1.5.0 to v1.5.4 too. Their C APIs differ
    # in places (v1.4.5 is the last 1.4 release; v1.5.3 and v1.5.4 are the
    # first whose bindings the duckdb-1-5-3 and duckdb-1-5-4 features compile
    # against): before
    # v1.5.5 `duckdb_scalar_function_bind_get_argument`
    # copies outside any `try` (a subquery argument aborted the process);
    # before v1.5.4 `duckdb_create_decimal_type` validates nothing; before
    # v1.5.0 scalar registration cannot add an overload to an existing name,
    # and the C API reports TIME_NS as INVALID. All of that went unnoticed
    # until the suite ran against the oldest release of each range, which
    # this job now does on every run.
    name: Test against DuckDB ${{ matrix.engine }} (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: v1.4.4
            crate: 1.4.4
            features: bundled-test-prebuilt
          - engine: v1.4.5
            crate: 1.4.5
            features: bundled-test-prebuilt
          - engine: v1.5.0
            crate: 1.10500.0
            features: bundled-test-prebuilt,duckdb-1-5
          # The first release whose bindings each version feature compiles
          # against.
          - engine: v1.5.3
            crate: 1.10503.0
            features: bundled-test-prebuilt,duckdb-1-5-3
          - engine: v1.5.4
            crate: 1.10504.0
            features: bundled-test-prebuilt,duckdb-1-5-4
          # The release Cargo.lock pinned until it moved to v1.5.6.
          - engine: v1.5.5
            crate: 1.10505.0
            features: bundled-test-prebuilt,duckdb-1-5-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pin the bindings to the engine and download its library
        # The test shim refuses a library whose duckdb_ext_api_v1 size differs
        # from the bindings', so both must be the same release.
        env:
          ENGINE: ${{ matrix.engine }}
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          cargo update -p duckdb --precise "$CRATE"
          cargo update -p libduckdb-sys --precise "$CRATE"
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          test "$DUCKDB_TAG" = "$ENGINE" || { echo "::error::pinned to ${DUCKDB_TAG}, not ${ENGINE}"; exit 1; }
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "${{ runner.temp }}/libduckdb"
      - name: Test
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
          FEATURES: ${{ matrix.features }}
        run: cargo test --all-targets --features "$FEATURES"

  test-duckdb-2-0:
    # The whole live suite against DuckDB v2.0.0, with the DuckDB 2.0 bindings
    # (`libduckdb-sys` / `duckdb` 1.20000.1; their bundled C API headers are
    # byte-identical to the v2.0.0 tag's). Separate from `test-older-engines`
    # only because Cargo.lock stays on the 1.5.6 bindings: the 2.0 bindings need
    # Rust 1.88.
    #
    # 1.20000.1, not 1.20000.0: the .0 release's bundled engine reports itself
    # as "v2.0.0-dev88614" (`pragma_version.cpp`), which the ABI check refuses
    # as unverifiable, so every `bundled-test` job on .0 failed. A fresh
    # `cargo update` selects .1, so .1 is what a user gets.
    #
    # Besides the live suite this runs what the other jobs run on the 1.5.6
    # bindings and nothing else covers on the 2.0 ones: clippy, rustdoc and the
    # doctests. (`test-bundled-duckdb-2-0` covers the source-build path.)
    name: Test against DuckDB v2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pin the DuckDB 2.0 bindings and download libduckdb v2.0.0
        run: |
          set -euo pipefail
          # `duckdb` pins `libduckdb-sys` exactly, so this moves both.
          cargo update -p duckdb --precise 1.20000.1
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          test "$DUCKDB_TAG" = "v2.0.0" || { echo "::error::bindings are ${DUCKDB_TAG}, not v2.0.0"; exit 1; }
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "${{ runner.temp }}/libduckdb"
      - name: Test
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo test --all-targets --features bundled-test-prebuilt,duckdb-1-5-4
      - name: Doctests
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo test --doc --features bundled-test-prebuilt,duckdb-1-5-4
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features duckdb-1-5-4 -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features duckdb-1-5-4

  # DuckDB 2.0 compiled from source (`bundled-test`), on the 2.0 bindings. The
  # path a contributor takes with no libduckdb on hand, and the one the
  # prebuilt job above does not touch. Informational (`continue-on-error`, and
  # so outside `ci-ok`) until it has a run history: a C++ build of DuckDB is
  # slow, and a failure here has so far been the bindings' own build, not
  # quack-rs.
  test-bundled-duckdb-2-0:
    name: Test bundled-test on the DuckDB 2.0 bindings (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pin the DuckDB 2.0 bindings
        run: |
          set -euo pipefail
          cargo update -p duckdb --precise 1.20000.1
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          test "$DUCKDB_TAG" = "v2.0.0" || { echo "::error::bindings are ${DUCKDB_TAG}, not v2.0.0"; exit 1; }
      - name: Test
        run: cargo test --features bundled-test,duckdb-1-5-4 --lib --test ffi_roundtrip

  test-duckdb-1-5:
    name: Test duckdb-1-5 / duckdb-1-5-3 / duckdb-1-5-4 features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --features duckdb-1-5
      - run: cargo test --all-targets --features duckdb-1-5
      - run: cargo clippy --all-targets --features duckdb-1-5 -- -D warnings
      - run: cargo check --all-targets --features duckdb-1-5-3
      - run: cargo test --all-targets --features duckdb-1-5-3
      - run: cargo clippy --all-targets --features duckdb-1-5-3 -- -D warnings
      - run: cargo check --all-targets --features duckdb-1-5-4
      - run: cargo test --all-targets --features duckdb-1-5-4
      - run: cargo clippy --all-targets --features duckdb-1-5-4 -- -D warnings

  wasm:
    name: WASM (wasm32-unknown-emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # DuckDB-WASM target. quack-rs's own lib must compile for wasm32; in
      # loadable-extension mode libduckdb-sys is headers-only, so `cargo check`
      # needs no emscripten toolchain. `--all-targets` is intentionally avoided —
      # it would pull the bundled-DuckDB test path, which requires em++.
      - run: cargo check --lib --target wasm32-unknown-emscripten
      - run: cargo check --lib --features duckdb-1-5-4 --target wasm32-unknown-emscripten
      # Checking is not running. wasm32 is the one 32-bit target quack-rs
      # supports, and the 32-bit size limits (`vector::ops::MAX_CAPACITY`,
      # `ListBuilder`'s reservation, the Arrow row-count bound) only take their
      # 32-bit values there, so the unit tests run on it under node. The first
      # run found two tests that assumed a 64-bit target and a limit message
      # that contradicted itself on 32-bit. emsdk is pinned by tag and commit
      # (a2b9277 is 6.0.10); the default 16 MB heap cannot grow, which some
      # tests need.
      - name: Install emsdk 6.0.10
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          git checkout --quiet a2b92777574c2feda07994cd4f1079a3dfc151f8
          ./emsdk install 6.0.10
          ./emsdk activate 6.0.10
      - name: Unit tests on wasm32 (node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: node
          RUSTFLAGS: "-D warnings -C link-arg=-sALLOW_MEMORY_GROWTH=1 -C link-arg=-sMAXIMUM_MEMORY=4GB"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cargo test --lib --target wasm32-unknown-emscripten
          cargo test --lib --features duckdb-1-5-4 --target wasm32-unknown-emscripten

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  # Informational early-warning for clippy lints graduating to stable.
  # `beta` becomes `stable` ~6 weeks later, so a failure here gives a heads-up
  # before the lint blocks merges. continue-on-error keeps it non-blocking.
  clippy-beta:
    name: Clippy (beta, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+beta` for the same reason as the MSRV job above: without it this ran
      # stable clippy and duplicated the `clippy` job.
      - run: cargo +beta clippy --all-targets --features duckdb-1-5-4 -- -D warnings
      # The end-to-end tests (`tests/ffi_roundtrip.rs` and the `live_tests`
      # modules) only compile with `bundled-test-prebuilt`, so the run above
      # never lints them: beta's `assert_is_empty` fired on four of them while
      # this job stayed green. Lint them too, against the same pre-built
      # libduckdb (version derived from Cargo.lock) as `test-bundled-prebuilt`.
      - name: Download pre-built libduckdb
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "${{ runner.temp }}/libduckdb"
      - name: Clippy beta (including the end-to-end tests)
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo +beta clippy --all-targets --features bundled-test-prebuilt,duckdb-1-5-4 -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --features duckdb-1-5-4 (implies duckdb-1-5-3, which implies
      # duckdb-1-5) rather than --all-features, which would compile DuckDB
      # from source here; `test-bundled` documents --all-features on Linux,
      # where that build is already cached.
      - run: cargo doc --no-deps --features duckdb-1-5-4
        env:
          RUSTDOCFLAGS: "-D warnings"
      # A dependent crate documents quack-rs with *its* feature set, usually
      # the default one, where a link to a feature-gated item is broken.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      # The book's changelog page is a mirror of CHANGELOG.md. Kept by hand it
      # drifted ~19 KB and dropped a whole subsection of the published 0.16.0
      # entry, so it is generated now and checked here.
      - name: Book changelog is in sync with CHANGELOG.md
        run: scripts/sync-book-changelog.py --check
      # The committed sitemap is generated from book/src/SUMMARY.md; nothing
      # checked it, and it fell 14 pages behind.
      - name: Book sitemap is in sync with SUMMARY.md
        run: python3 scripts/generate-sitemap.py --check
      # An invalid workflow file does not fail loudly: GitHub records a run
      # with zero jobs and the workflow silently stops running. That is how the
      # mutation gate stopped executing on PRs -- a shell comment inside a
      # `run:` block wrote out an empty expression while explaining not to use
      # one, and GitHub evaluates expressions even inside shell comments.
      # Neither yaml.safe_load nor a JSON-Schema check sees it: both treat the
      # `run:` block as an opaque string. See scripts/check-workflow-expressions.py.
      - name: Workflow files contain no invalid expressions
        run: scripts/check-workflow-expressions.py
      # `ci-ok` is the one required check; it is only as good as its `needs`.
      - name: The ci-ok job waits on every blocking job
        run: scripts/check-ci-aggregate.py
      # The six upstream-comparison steps run through this wrapper; a mapping
      # that read a missing script, or exit 2 on a release, as a pass would turn
      # each of them into a check of nothing.
      - name: The upstream-guard wrapper maps exit codes as documented
        run: scripts/upstream-guard.sh --self-test
      # Cargo.toml's version, every committed Cargo.lock, the CHANGELOG,
      # CITATION.cff, SECURITY.md and every `quack-rs = "0.X"` snippet must name
      # the same release.
      - name: Release metadata agrees with Cargo.toml
        run: python3 scripts/check-release-metadata.py

  msrv:
    name: MSRV (1.86.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+1.86.0` is not optional, for the same reason the `nightly` and `miri`
      # jobs below use `+nightly`: `rust-toolchain.toml` pins `channel =
      # "stable"`, and a rustup toolchain file overrides the default this action
      # sets. A bare `cargo check` here runs stable and tests nothing -- the
      # MSRV gate was inert. This matches `cargo +1.86.0 check` in CONTRIBUTING.
      #
      # Against what a 1.86.0 user's Cargo resolves, not the committed
      # Cargo.lock: that carries the newest compatible releases, and
      # `libduckdb-sys` 1.10506.1 (which moved off `zip` 6, RUSTSEC-2026-0367 /
      # -0368 / -0369) declares `rust-version` 1.88. The rust-version-aware
      # fallback picks the newest release each dependency has for 1.86.0
      # (libduckdb-sys 1.10506.0 today), which is what the MSRV promises a
      # dependant.
      - name: Resolve dependencies for 1.86.0
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +1.86.0 update
      - run: cargo +1.86.0 check
      # The `duckdb-1-5*` code, the arrow module included, is behind a feature
      # the default check does not compile.
      - run: cargo +1.86.0 check --features duckdb-1-5-4

  dependency-floor:
    # Cargo.toml declares `duckdb` / `libduckdb-sys` `>=1.4.4, <2`, but every
    # other job builds the newest release Cargo.lock pins. This one resolves the
    # declared floor and runs the library tests there, so the lower bound is a
    # tested claim rather than a hope.
    #
    # On stable, not 1.86.0: at the 1.4.4 floor the resolver picks `icu` 2.3
    # crates (libduckdb-sys 1.4.4 -> reqwest -> url -> idna -> icu_normalizer),
    # which need rustc 1.88, so `cargo +1.86.0` fails there before reaching
    # quack-rs. The MSRV
    # job above covers 1.86.0 with the locked dependencies; this covers the
    # dependency floor with a current compiler.
    name: Dependency floor (duckdb / libduckdb-sys 1.4.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve the declared floor
        run: |
          set -euo pipefail
          cargo update -p duckdb --precise 1.4.4
          cargo update -p libduckdb-sys --precise 1.4.4
          grep -A1 -E '^name = "(duckdb|libduckdb-sys)"$' Cargo.lock
      - run: cargo test --lib

  bench-compile:
    name: Benchmark (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo bench --no-run
      # The engine-level benchmark extension (benches/engine) is a separate crate;
      # keep it compiling, and its driver parsing.
      - run: cargo check --manifest-path benches/engine/Cargo.toml
      - run: python3 -m py_compile benches/engine/compare.py

  example-check:
    name: Example (hello-ext · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --manifest-path examples/hello-ext/Cargo.toml --all-targets
      - name: Clippy (Linux only)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path examples/hello-ext/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path examples/hello-ext/Cargo.toml

  scaffold-compile:
    name: Scaffold (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify scaffold output compiles
        run: cargo test scaffold_generated_code_compiles -- --nocapture

  symbol-check:
    name: Symbol check (hello-ext · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build hello-ext as cdylib
        run: cargo build --manifest-path examples/hello-ext/Cargo.toml --release
      - name: Verify extension entry point symbol (Linux)
        if: runner.os == 'Linux'
        run: |
          SO="examples/hello-ext/target/release/libhello_ext.so"
          if [ ! -f "$SO" ]; then echo "No libhello_ext.so found"; exit 1; fi
          nm -D "$SO" | grep -q 'T hello_ext_init_c_api' || {
            echo "ERROR: entry point symbol hello_ext_init_c_api not found in $SO"
            nm -D "$SO" | head -20
            exit 1
          }
          echo "Found hello_ext_init_c_api in $SO"
      - name: Verify extension entry point symbol (macOS)
        if: runner.os == 'macOS'
        run: |
          DYLIB="examples/hello-ext/target/release/libhello_ext.dylib"
          if [ ! -f "$DYLIB" ]; then echo "No libhello_ext.dylib found"; exit 1; fi
          nm -g "$DYLIB" | grep -q '_hello_ext_init_c_api' || {
            echo "ERROR: entry point symbol _hello_ext_init_c_api not found in $DYLIB"
            nm -g "$DYLIB" | head -20
            exit 1
          }
          echo "Found _hello_ext_init_c_api in $DYLIB"

  abi-table:
    name: ABI layout table (vs upstream DuckDB headers), and every C API slot wrapped or listed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Re-derives the DuckDB release -> duckdb_ext_api_v1 slot-count table in
      # src/abi.rs straight from each release's duckdb_extension.h. Fails when a
      # new DuckDB release changes the layout, which is exactly when the runtime
      # guard would start refusing loads it should accept.
      - name: Verify src/abi.rs matches upstream
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- a DuckDB release header was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: scripts/upstream-guard.sh scripts/check-abi-table.py
      # Every slot of the C extension API is either used under src/ or listed,
      # with a reason, in scripts/api-coverage-allowlist.txt, so a slot a DuckDB
      # release adds is noticed instead of left for someone to read the header.
      - name: Classify the C API surface
        run: scripts/upstream-guard.sh scripts/check-api-coverage.py

  platform-table:
    name: Platform list (vs upstream distribution matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # validate::platform only earns its keep if its list is current. DuckDB
      # retired linux_amd64_gcc4 and added the musl targets without quack-rs
      # noticing, so the validator was rejecting real platforms and accepting
      # one that no longer exists. This re-derives the list from the file the
      # community-extensions build actually reads.
      - name: Verify src/validate/platform.rs matches upstream
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- the distribution matrix was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: scripts/upstream-guard.sh scripts/check-platform-table.py

  spdx-list:
    name: SPDX shortlist (vs official registry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A typo in COMMON_SPDX_LICENSES would make quack-rs reject a license
      # nobody could satisfy, and SPDX deprecates identifiers over time
      # (GPL-3.0 -> GPL-3.0-only / -or-later), which would have quack-rs
      # recommending a stale name.
      - name: Verify src/validate/spdx.rs matches the SPDX registry
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- the SPDX registry was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: scripts/upstream-guard.sh scripts/check-spdx-list.py

  autoload-entries:
    name: Catalog autoload names (vs every supported DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `catalog` refuses Type/Collation lookups of names that make DuckDB
      # autoload an extension, because a failed autoload inside
      # duckdb_catalog_get_entry aborts the process. The names are copied
      # from DuckDB's extension_entries.hpp; this fails when a release adds
      # one the list lacks.
      - name: Verify src/catalog.rs covers every supported release
        # Exit 2 is the documented "could not check" code (upstream
        # unreachable) and must not be read as drift.
        run: scripts/upstream-guard.sh scripts/check-autoload-entries.py

  book:
    name: Book builds (mdBook)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The versioned-site step below builds each release line from its tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      # docs.yml builds the book only when main is pushed, so a broken page
      # was found after merge. The version is the one book/mdbook-version pins,
      # which docs.yml's build script also reads.
      - name: Install mdBook
        env:
          RUSTFLAGS: ""
        run: cargo install mdbook --locked --version "$(cat book/mdbook-version)"
      - run: mdbook build
      # Per-page description, canonical and og: tags, as docs.yml deploys
      # them; fails on a missing or duplicate description or title, or a
      # sitemap that does not list exactly the canonical URLs.
      - name: Per-page SEO tags
        run: python3 scripts/seo-postbuild.py book/book
      # mdBook checks neither `#anchor`s nor docs.rs links. Rustdoc with the
      # docs.rs feature set (Cargo.toml [package.metadata.docs.rs]) gives the
      # pages the docs.rs links must resolve to once released.
      - run: cargo doc --no-deps --features duckdb-1-5-4
      - name: Book and README links resolve
        run: python3 scripts/check-book-links.py
      # What docs.yml deploys: every release line from its tag, main as
      # /dev/ with its rustdoc, the version menu and the SEO split between
      # the root and the copies. Fails on a build error or a failed check.
      - name: Versioned site builds
        run: python3 scripts/build-versioned-site.py --out site --dev-api target/doc

  msrv-vs-duckdb-ci:
    name: MSRV vs DuckDB's extension CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DuckDB's reusable extension-distribution workflow pins an exact Rust
      # toolchain for some platforms (the WebAssembly job in particular). Raising
      # quack-rs's MSRV above one of those pins silently makes every downstream
      # extension unbuildable for those platforms, with no signal here. This
      # gives that signal.
      - name: Check MSRV against extension-ci-tools' pinned toolchains
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- the pinned-toolchain config was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: scripts/upstream-guard.sh scripts/check-msrv-vs-duckdb-ci.py

  extension-load:
    name: Extension load test (DuckDB ${{ matrix.duckdb }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The README claims quack-rs supports DuckDB 1.4.4 and later 1.x. One
      # `releases/latest` run samples a single point of that claim and silently
      # retargets whenever DuckDB ships. hello-ext uses only the frozen stable
      # prefix and is stamped `C_STRUCT` + `v1.2.0`, so it is supposed to load
      # into every one of these — which is exactly the property worth proving,
      # and the one that would break silently.
      #
      # v2.0.0 accepts C API v1 extensions up to v1.5.6, so a v1.2.0 stamp
      # still loads there (its loader: `IsSupportedCAPIVersion`).
      #
      # `latest` stays in the matrix as the early-warning signal for a DuckDB
      # that has not been pinned here yet.
      matrix:
        duckdb: ["v1.4.4", "v1.5.0", "v1.5.5", "v1.5.6", "v2.0.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build hello-ext as cdylib
        run: cargo build --manifest-path examples/hello-ext/Cargo.toml --release
      - name: Build append_metadata
        run: cargo build --release --bin append_metadata
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          # Asset names differ between 1.x and 2.x; the script picks the right
          # one and resolves `latest` to a tag.
          scripts/fetch-duckdb.sh "${{ matrix.duckdb }}" cli .
          # Record which DuckDB this job is actually testing against. Without
          # it, a failure three steps later is indistinguishable from a wrong
          # answer -- and these jobs pull `releases/latest`, so the version
          # changes underneath them.
          ./duckdb --version
          # Prove the exact invocation the probes use works, before anything
          # depends on it. Two things bit us here: `-no-stdin < file.sql`
          # produced no output and still exited 0, so assertions downstream
          # failed as "wrong answer" when the SQL had never run; and
          # `SET allow_unsigned_extensions=true` is rejected once the database
          # is running ("Cannot change allow_unsigned_extensions setting while
          # database is running"), so it has to be the `-unsigned` startup flag
          # rather than a statement.
          test "$(./duckdb -unsigned -csv -noheader -c 'SELECT 41 + 1;')" = "42" || {
            echo "::error::DuckDB CLI smoke test failed -- '-unsigned -c' did not execute SQL"
            exit 1
          }
      - name: Stamp the extension metadata footer
        # DuckDB refuses to LOAD a file that does not end in .duckdb_extension
        # ("Permission Error: DuckDB extensions are files ending with
        # '.duckdb_extension'") and one without a valid metadata footer, so the
        # footer append_metadata writes is what this job exercises.
        run: |
          set -euo pipefail
          SO="examples/hello-ext/target/release/libhello_ext.so"
          test -f "$SO" || { echo "::error::$SO not found"; exit 1; }
          mkdir -p /tmp/ext
          ./target/release/append_metadata "$SO" /tmp/ext/hello_ext.duckdb_extension \
            --abi-type C_STRUCT \
            --extension-version v0.1.0 \
            --duckdb-version v1.2.0 \
            --platform linux_amd64 \
            --dump
      - name: Load extension and assert query results
        run: |
          set -euo pipefail
          cat > /tmp/probe.sql <<'SQL'
          LOAD '/tmp/ext/hello_ext.duckdb_extension';
          SELECT double_it(21) AS a, first_word('hello world') AS b;
          SQL
          ./duckdb -unsigned -csv -noheader -c "$(cat /tmp/probe.sql)" | tee /tmp/load.log

          # Assert on the actual result, not on the absence of the word "error":
          # a load failure and a wrong answer must both fail this job.
          grep -qx '42,hello' /tmp/load.log || {
            echo "::error::expected '42,hello' from the loaded extension"
            echo "DuckDB $(./duckdb --version) actually produced:"
            cat /tmp/load.log
            exit 1
          }
          echo "Extension loaded and produced correct results"
      - name: Every documented hello-ext check
        # examples/hello-ext/README.md documents 31 statements and their
        # results; this used to run two of them. The script runs all of
        # examples/hello-ext/sql_checks.txt and also fails if the README's
        # statements drift from that fixture.
        run: python3 scripts/check-hello-ext.py --duckdb ./duckdb --extension /tmp/ext/hello_ext.duckdb_extension

  scaffold-e2e:
    name: Scaffold end-to-end (build, stamp, load, query)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          scripts/fetch-duckdb.sh latest cli .
          # Record which DuckDB this job is actually testing against. Without
          # it, a failure three steps later is indistinguishable from a wrong
          # answer -- and these jobs pull `releases/latest`, so the version
          # changes underneath them.
          ./duckdb --version
          # Prove the exact invocation the probes use works, before anything
          # depends on it. Two things bit us here: `-no-stdin < file.sql`
          # produced no output and still exited 0, so assertions downstream
          # failed as "wrong answer" when the SQL had never run; and
          # `SET allow_unsigned_extensions=true` is rejected once the database
          # is running ("Cannot change allow_unsigned_extensions setting while
          # database is running"), so it has to be the `-unsigned` startup flag
          # rather than a statement.
          test "$(./duckdb -unsigned -csv -noheader -c 'SELECT 41 + 1;')" = "42" || {
            echo "::error::DuckDB CLI smoke test failed -- '-unsigned -c' did not execute SQL"
            exit 1
          }
      - name: Generate, build, stamp and load a scaffolded extension
        # `scaffold-compile` only checks that the generated sources compile. This
        # job takes the generated project all the way to a .duckdb_extension that
        # a real DuckDB loads and queries — which is what "the scaffold works"
        # actually means.
        run: |
          set -euo pipefail
          cargo build --release --bin append_metadata
          cargo run --release --example scaffold_to_dir -- my_analytics /tmp/scaffolded
          # Build against this working copy rather than the published crate.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("/tmp/scaffolded/Cargo.toml")
          s = p.read_text()
          # `subn` + assert: if the template's dependency line ever changes
          # shape, a bare `sub` matches nothing and the job silently builds
          # the PUBLISHED crate instead of this working copy.
          s, n = re.subn(r'quack-rs = \{ version = "[^"]+" \}',
                         'quack-rs = { path = "%s" }' % pathlib.Path.cwd(), s)
          assert n == 1, f"expected exactly one quack-rs dependency line, rewrote {n}"
          p.write_text(s)
          PY
          # The generated project declares quack-rs's MSRV and resolves with
          # resolver 3; a fresh lock file must build on that toolchain (it
          # used to pull zopfli 0.8.4, which needs Rust 1.88). The lock file
          # it writes is what the stable builds below reuse.
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' /tmp/scaffolded/Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          (cd /tmp/scaffolded && cargo "+$msrv" generate-lockfile && cargo "+$msrv" build --release)
          (cd /tmp/scaffolded && cargo build --release)
          # crate-type = ["cdylib", "rlib"] must still produce the cdylib.
          test -f /tmp/scaffolded/target/release/libmy_analytics.so
          ./target/release/append_metadata \
            /tmp/scaffolded/target/release/libmy_analytics.so \
            /tmp/scaffolded/my_analytics.duckdb_extension \
            --abi-type C_STRUCT --extension-version v0.1.0 \
            --duckdb-version v1.2.0 --platform linux_amd64
          cat > /tmp/scaffold_probe.sql <<'SQL'
          LOAD '/tmp/scaffolded/my_analytics.duckdb_extension';
          SELECT my_analytics_hello('world');
          SELECT coalesce(my_analytics_hello(NULL), 'NULL-propagated');
          SQL
          ./duckdb -unsigned -csv -noheader -c "$(cat /tmp/scaffold_probe.sql)" | tee /tmp/scaffold.log
          grep -q 'Hello from my_analytics! world' /tmp/scaffold.log || {
            echo "::error::scaffolded extension did not answer correctly"
            echo "DuckDB $(./duckdb --version) actually produced:"
            cat /tmp/scaffold.log
            exit 1
          }
          grep -q 'NULL-propagated' /tmp/scaffold.log || {
            echo "::error::my_analytics_hello(NULL) did not return NULL"
            cat /tmp/scaffold.log
            exit 1
          }
      - name: Generated project passes its own lint gate
        # The generated CI runs `cargo clippy --all-targets -- -D warnings`, so
        # the generated sources must be clean under it from the first commit.
        run: |
          set -euo pipefail
          cd /tmp/scaffolded
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          # A description whose lines read as Markdown blocks (a list item with
          # a lazy continuation, a quote, a fence, an indented line) used to
          # trip clippy::doc_lazy_continuation or become a doctest that does
          # not compile; with the rlib crate type, `cargo test` runs doctests.
          cd "$GITHUB_WORKSPACE"
          cargo run --release --example scaffold_to_dir -- md_desc /tmp/md_desc \
            --description "$(printf 'Functions:\n- one\nand more\n> quote\nlazy\n```rust\n    let x = ;\n1. first')"
          sed -i "s|quack-rs = { version = \"[^\"]*\" }|quack-rs = { path = \"$GITHUB_WORKSPACE\" }|" /tmp/md_desc/Cargo.toml
          grep -q "quack-rs = { path = " /tmp/md_desc/Cargo.toml
          cd /tmp/md_desc
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Generated project's own make configure / release / test
        # The steps above stamp with quack-rs's own tool. The generated CI
        # builds through extension-ci-tools' Makefiles instead and runs the
        # SQLLogicTest in test/sql, so run that path too, with DUCKDB_PLATFORM
        # empty as the generated CI sets it on Linux (`linux_amd64` makes
        # base.Makefile print "Skipping tests.." and pass). The commands are
        # the book's "After scaffolding" sequence, with extension-ci-tools at
        # the branch the generated .gitmodules and distribution workflow name
        # (so a branch that does not exist fails here).
        env:
          DUCKDB_PLATFORM: ""
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          cd /tmp/scaffolded
          ref=$(git config -f .gitmodules submodule.extension-ci-tools.branch)
          grep -q "_extension_distribution.yml@$ref\$" .github/workflows/MainDistributionPipeline.yml
          git init -q
          git submodule add -q -b "$ref" https://github.com/duckdb/extension-ci-tools.git extension-ci-tools
          # Before the first commit, extension-ci-tools' version detection
          # records git's error message, which overflows the footer's 32-byte
          # version field; the generated Makefile falls back to Cargo.toml's.
          mkdir -p configure
          make extension_version
          test "$(cat configure/extension_version.txt)" = "v0.1.0" || {
            echo "::error::uncommitted repo: extension version is '$(cat configure/extension_version.txt)', expected v0.1.0"; exit 1; }
          rm -rf configure
          git add -A
          git commit -qm scaffold
          make configure release test 2>&1 | tee /tmp/scaffold_make.log
          test "$(cat configure/extension_version.txt)" = "$(git log -1 --format=%h)"
          if grep -q 'Skipping tests' /tmp/scaffold_make.log; then
            echo "::error::the generated project's SQLLogicTest was skipped"; exit 1
          fi
          grep -qx 'SUCCESS' /tmp/scaffold_make.log || {
            echo "::error::the generated project's SQLLogicTest did not report SUCCESS"; exit 1; }
      - name: A C API v1.5.6 scaffold using duckdb-1-5, built and tested by extension-ci-tools
        # The stamping quack-rs recommends for the duckdb-1-5 features since
        # DuckDB 2.0 (which refuses C_STRUCT_UNSTABLE V1 binaries). The extension
        # calls past the stable prefix at load, so quack-rs's ABI guard runs
        # against whatever DuckDB extension-ci-tools tests with (the newest on
        # PyPI), and the footer must say C_STRUCT / v1.5.6.
        env:
          DUCKDB_PLATFORM: ""
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          cargo run --release --example scaffold_to_dir -- my_capi /tmp/scaffolded_capi --c-api v1.5.6
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import pathlib, re, sys
          d = pathlib.Path("/tmp/scaffolded_capi")
          p = d / "Cargo.toml"
          s, n = re.subn(r'quack-rs = \{ version = "[^"]+" \}',
                         'quack-rs = { path = "%s", features = ["duckdb-1-5"] }' % sys.argv[1], p.read_text())
          assert n == 1, n
          p.write_text(s)
          p = d / "src/lib.rs"
          old = "fn register(con: libduckdb_sys::duckdb_connection) -> Result<(), ExtensionError> {\n"
          s = p.read_text()
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + "    let _ = unsafe { quack_rs::client_context::ClientContext::from_connection(con) }?.connection_id();\n"))
          PY
          cd /tmp/scaffolded_capi
          ref=$(git config -f .gitmodules submodule.extension-ci-tools.branch)
          git init -q
          git submodule add -q -b "$ref" https://github.com/duckdb/extension-ci-tools.git extension-ci-tools
          git add -A
          git commit -qm scaffold
          make configure release test 2>&1 | tee /tmp/scaffold_capi_make.log
          grep -qx 'SUCCESS' /tmp/scaffold_capi_make.log || {
            echo "::error::the C API v1.5.6 project's SQLLogicTest did not report SUCCESS"; exit 1; }
          ext=$(find build -name 'my_capi.duckdb_extension' | head -n 1)
          python3 - "$ext" <<'PY'
          import sys
          footer = open(sys.argv[1], "rb").read()[-512:]
          fields = [footer[i * 32:(i + 1) * 32].rstrip(b"\0").decode() for i in range(8)]
          print(fields)
          assert fields[3] == "C_STRUCT" and fields[5] == "v1.5.6", fields
          PY

  abi-guard:
    # What this job proves is narrow: a build whose QUACK_RS_TARGET_DUCKDB_VERSION
    # contradicts its own bindings is refused (AbiCheck::DeclaredVersionMismatch),
    # whatever DuckDB loads it. It never reaches the layout comparison itself --
    # `abi-guard-layout` below is the job that exercises LayoutMismatch.
    name: ABI guard refuses a build whose declared DuckDB version contradicts its bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          scripts/fetch-duckdb.sh latest cli .
          # Record which DuckDB this job is actually testing against. Without
          # it, a failure three steps later is indistinguishable from a wrong
          # answer -- and these jobs pull `releases/latest`, so the version
          # changes underneath them.
          ./duckdb --version
          # Prove the exact invocation the probes use works, before anything
          # depends on it. Two things bit us here: `-no-stdin < file.sql`
          # produced no output and still exited 0, so assertions downstream
          # failed as "wrong answer" when the SQL had never run; and
          # `SET allow_unsigned_extensions=true` is rejected once the database
          # is running ("Cannot change allow_unsigned_extensions setting while
          # database is running"), so it has to be the `-unsigned` startup flag
          # rather than a statement.
          test "$(./duckdb -unsigned -csv -noheader -c 'SELECT 41 + 1;')" = "42" || {
            echo "::error::DuckDB CLI smoke test failed -- '-unsigned -c' did not execute SQL"
            exit 1
          }
      # Regression test for the most dangerous failure mode this crate guards
      # against: an extension that touches the unstable region of
      # duckdb_ext_api_v1, compiled against one DuckDB's headers and loaded into
      # another. Without the guard this corrupts the heap; with it, LOAD fails
      # with a diagnostic. See src/abi.rs.
      - name: Build a demo whose declared DuckDB version contradicts its bindings
        # The refusal must not depend on `releases/latest` differing from the
        # pin: when the runner's DuckDB happens to match, the guard correctly
        # stays silent and this job used to fail claiming the guard was broken.
        #
        # QUACK_RS_TARGET_DUCKDB_VERSION=v1.2.0 (408 slots) against
        # libduckdb-sys =1.10500.0 (DuckDB 1.5.0, 545 slots) is a contradiction
        # the guard can settle without consulting the engine at all, so this
        # fires on every runner.
        env:
          QUACK_RS_TARGET_DUCKDB_VERSION: v1.2.0
        run: |
          set -euo pipefail
          cargo build --release --bin append_metadata
          mkdir -p /tmp/abi_demo/src
          cat > /tmp/abi_demo/Cargo.toml <<EOF
          [package]
          name = "abi_demo"
          version = "0.1.0"
          edition = "2021"

          [lib]
          name = "abi_demo"
          crate-type = ["cdylib"]

          [dependencies]
          quack-rs = { path = "$(pwd)", features = ["duckdb-1-5"] }
          libduckdb-sys = { version = "=1.10500.0", features = ["loadable-extension"] }

          [profile.release]
          opt-level = 1
          panic = "unwind"
          EOF
          cat > /tmp/abi_demo/src/lib.rs <<'EOF'
          use quack_rs::client_context::ClientContext;
          use quack_rs::error::ExtensionError;
          use quack_rs::prelude::*;

          fn register(con: libduckdb_sys::duckdb_connection) -> Result<(), ExtensionError> {
              // duckdb_connection_get_client_context lives past the stable prefix.
              let ctx = unsafe { ClientContext::from_connection(con) }?;
              let _ = ctx.connection_id();
              unsafe { SqlMacro::scalar("abi_demo_ok", &["x"], "x + 1")?.register(con)? };
              Ok(())
          }

          quack_rs::entry_point!(abi_demo_init_c_api, register);
          EOF
          (cd /tmp/abi_demo && cargo build --release)
          ./target/release/append_metadata \
            /tmp/abi_demo/target/release/libabi_demo.so \
            /tmp/abi_demo/abi_demo.duckdb_extension \
            --abi-type C_STRUCT --extension-version v0.1.0 \
            --duckdb-version v1.2.0 --platform linux_amd64
      - name: LOAD must be refused with a layout diagnostic
        run: |
          set -euo pipefail
          cat > /tmp/abi_probe.sql <<'SQL'
          LOAD '/tmp/abi_demo/abi_demo.duckdb_extension';
          SQL
          # DuckDB exits non-zero on the failed LOAD, which is the expected outcome.
          ./duckdb -unsigned -c "$(cat /tmp/abi_probe.sql)" > /tmp/abi.log 2>&1 || true
          echo "--- DuckDB $(./duckdb --version) said: ---"
          cat /tmp/abi.log
          echo "--- end ---"
          # This is the DeclaredVersionMismatch arm of AbiCheck::error_message,
          # pinned by `declared_version_mismatch_matches_the_ci_regression_test`
          # in src/abi.rs so the job and the code cannot drift apart.
          grep -q "QUACK_RS_TARGET_DUCKDB_VERSION says this extension was built against DuckDB" /tmp/abi.log || {
            echo "::error::the ABI guard did not refuse a build whose declared DuckDB version contradicts its bindings"
            exit 1
          }
          # And the extension must not have loaded: a refusal that still
          # registers its functions would be worse than no guard at all. The
          # statements go through stdin, not `-c`: `-c` stops at the failed
          # LOAD, so the SELECT would never run and this check could not fail.
          # The marker row proves the statements after the LOAD did run.
          printf "%s\n" "LOAD '/tmp/abi_demo/abi_demo.duckdb_extension';" \
            "SELECT abi_demo_ok(1);" "SELECT 'after-load';" \
            | ./duckdb -unsigned -csv -noheader > /tmp/abi_fn.log 2>&1 || true
          cat /tmp/abi_fn.log
          grep -qx 'after-load' /tmp/abi_fn.log || {
            echo "::error::the statements after the refused LOAD did not run"; exit 1; }
          if grep -qx '2' /tmp/abi_fn.log; then
            echo "::error::the refused extension still registered abi_demo_ok"
            exit 1
          fi

  abi-guard-layout:
    # The real failure the ABI guard exists for: a `duckdb-1-5` extension built
    # the ordinary way -- no QUACK_RS_TARGET_DUCKDB_VERSION, against the
    # libduckdb-sys this repository pins in Cargo.lock -- and stamped C_STRUCT,
    # so DuckDB's own metadata check lets it into any release. Loaded into a
    # DuckDB whose duckdb_ext_api_v1 has a different slot count it must be
    # refused with the LayoutMismatch diagnostic and register nothing; loaded
    # into the DuckDB its bindings came from it must work. The engines are
    # pinned releases, not `latest`, so the expected verdict never shifts.
    name: ABI guard refuses a real layout mismatch (and accepts the matching DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and stamp a duckdb-1-5 demo against the pinned bindings
        run: |
          set -euo pipefail
          # Deliberately unset: this build declares nothing, like most do.
          unset QUACK_RS_TARGET_DUCKDB_VERSION
          sys=$(awk '/^name = "libduckdb-sys"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          echo "libduckdb-sys pinned in Cargo.lock: $sys (DuckDB $(scripts/duckdb-version-from-lock.sh))"
          cargo build --release --bin append_metadata
          mkdir -p /tmp/abi_layout/src
          cat > /tmp/abi_layout/Cargo.toml <<EOF
          [package]
          name = "abi_layout"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          quack-rs = { path = "$(pwd)", features = ["duckdb-1-5"] }
          libduckdb-sys = { version = "=$sys", features = ["loadable-extension"] }

          [profile.release]
          opt-level = 1
          panic = "unwind"

          [workspace]
          EOF
          cat > /tmp/abi_layout/src/lib.rs <<'EOF'
          use quack_rs::client_context::ClientContext;
          use quack_rs::error::ExtensionError;
          use quack_rs::prelude::*;

          fn register(con: libduckdb_sys::duckdb_connection) -> Result<(), ExtensionError> {
              // duckdb_connection_get_client_context lives past the stable prefix.
              let ctx = unsafe { ClientContext::from_connection(con) }?;
              let _ = ctx.connection_id();
              unsafe { SqlMacro::scalar("abi_layout_ok", &["x"], "x + 1")?.register(con)? };
              Ok(())
          }

          quack_rs::entry_point!(abi_layout_init_c_api, register);
          EOF
          (cd /tmp/abi_layout && cargo build --release)
          ./target/release/append_metadata \
            /tmp/abi_layout/target/release/libabi_layout.so \
            /tmp/abi_layout/abi_layout.duckdb_extension \
            --abi-type C_STRUCT --extension-version v0.1.0 \
            --duckdb-version v1.2.0 --platform linux_amd64
      - name: Refused by DuckDB v1.5.0 and v1.4.4, loaded by the matching release
        run: |
          set -euo pipefail
          matching=$(scripts/duckdb-version-from-lock.sh)
          probe() {  # <duckdb-version> <expected: refuse|load>
            local v=$1 expect=$2 dir=/tmp/duckdb-$1
            mkdir -p "$dir"
            scripts/fetch-duckdb.sh "$v" cli "$dir" > /dev/null
            echo "--- $("$dir/duckdb" --version), expecting $expect ---"
            # stdin, not `-c`: `-c` stops at a failed LOAD, so the SELECT
            # would never run; the marker row proves it did.
            printf "%s\n" "LOAD '/tmp/abi_layout/abi_layout.duckdb_extension';" \
              "SELECT abi_layout_ok(1);" "SELECT 'after-load';" \
              | "$dir/duckdb" -unsigned -csv -noheader > "$dir/out.log" 2>&1 || true
            cat "$dir/out.log"
            grep -qx 'after-load' "$dir/out.log" || {
              echo "::error::DuckDB $v: the statements after the LOAD did not run"; exit 1; }
            if [ "$expect" = refuse ]; then
              # The LayoutMismatch arm of AbiCheck::error_message.
              grep -q "DuckDB C extension API layout mismatch" "$dir/out.log" || {
                echo "::error::DuckDB $v: expected the layout-mismatch refusal"; exit 1; }
              if grep -qx '2' "$dir/out.log"; then
                echo "::error::DuckDB $v: the refused extension still registered abi_layout_ok"; exit 1
              fi
            else
              grep -qx '2' "$dir/out.log" || {
                echo "::error::DuckDB $v: the extension should have loaded and answered 2"; exit 1; }
            fi
          }
          probe v1.5.0 refuse
          probe v1.4.4 refuse
          probe "$matching" load
      - name: Stamped C_STRUCT + C API v1.5.6, loaded by DuckDB v1.5.6 and v2.0.0
        # The stamping quack-rs documents for a duckdb-1-5 build since DuckDB
        # 2.0, which loads a C_STRUCT_UNSTABLE binary only through the C API v2
        # entry point. DuckDB before v1.5.6 must refuse it itself (its C API
        # is v1.2.0); v1.5.6 and v2.0.0 must load it, v2.0.0 because its
        # 548-slot layout only appends to the 546-slot one these bindings
        # have (src/abi.rs, PREFIX_LAYOUTS). Valid while Cargo.lock is on the
        # v1.5.2 - v1.5.6 bindings, which the first check asserts.
        run: |
          set -euo pipefail
          case "$(scripts/duckdb-version-from-lock.sh)" in
            v1.5.[2-6]) ;;
            *) echo "::error::Cargo.lock is not on v1.5.2 - v1.5.6 bindings; update this step"; exit 1 ;;
          esac
          ./target/release/append_metadata \
            /tmp/abi_layout/target/release/libabi_layout.so \
            /tmp/abi_layout/abi_layout_156.duckdb_extension \
            --abi-type C_STRUCT --extension-version v0.1.0 \
            --duckdb-version v1.5.6 --platform linux_amd64
          # DuckDB derives the init symbol from the file name.
          mkdir -p /tmp/abi_156
          cp /tmp/abi_layout/abi_layout_156.duckdb_extension /tmp/abi_156/abi_layout.duckdb_extension
          probe() {  # <duckdb-version> <expected: refuse|load>
            local v=$1 expect=$2 dir=/tmp/duckdb156-$1
            mkdir -p "$dir"
            scripts/fetch-duckdb.sh "$v" cli "$dir" > /dev/null
            echo "--- $("$dir/duckdb" --version), expecting $expect ---"
            printf "%s\n" "LOAD '/tmp/abi_156/abi_layout.duckdb_extension';" \
              "SELECT abi_layout_ok(1);" "SELECT 'after-load';" \
              | "$dir/duckdb" -unsigned -csv -noheader > "$dir/out.log" 2>&1 || true
            cat "$dir/out.log"
            grep -qx 'after-load' "$dir/out.log" || {
              echo "::error::DuckDB $v: the statements after the LOAD did not run"; exit 1; }
            if [ "$expect" = refuse ]; then
              grep -q "built for DuckDB C API version 'v1.5.6'" "$dir/out.log" || {
                echo "::error::DuckDB $v: expected DuckDB to refuse C API v1.5.6"; exit 1; }
            else
              grep -qx '2' "$dir/out.log" || {
                echo "::error::DuckDB $v: the extension should have loaded and answered 2"; exit 1; }
            fi
          }
          probe v1.5.5 refuse
          probe v1.5.6 load
          probe v2.0.0 load

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--locked`, as release.yml's `package` and `publish` jobs run it: without
      # it a Cargo.toml version bump that left Cargo.lock behind passed here
      # (cargo quietly rewrote the lock file) and failed only at release time.
      # No `--allow-dirty`: a clean checkout is what is being packaged.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  security:
    name: Security (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Install cargo-deny
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-deny --locked --version "0.20.2"
      - name: Run cargo-deny check
        run: cargo deny check

  # OSV / GHSA advisory scan. The cargo-deny job above consults only the RustSec
  # advisory database; OSV.dev aggregates GHSA *and* RustSec, so GHSA-only
  # advisories that RustSec has not mirrored (e.g. GHSA-3pv8-6f4r-ffg2 in `tar`)
  # are caught here. Scans every committed lockfile — `tar` reaches the example
  # via the `libduckdb-sys` build-dependency. The binary is version- and checksum-pinned.
  osv-scan:
    name: Security (OSV / GHSA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          VER=2.7.0
          # From the release's osv-scanner_SHA256SUMS (linux_amd64).
          SHA=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64"
          echo "${SHA}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan every committed lockfile against OSV
        run: |
          # All four committed lockfiles. fuzz/Cargo.lock and then
          # book/doctest/Cargo.lock were missing: their dependencies are
          # CI-only, but an unscanned lockfile is an unscanned lockfile.
          ./osv-scanner --config=osv-scanner.toml \
            --lockfile=Cargo.lock \
            --lockfile=examples/hello-ext/Cargo.lock \
            --lockfile=fuzz/Cargo.lock \
            --lockfile=book/doctest/Cargo.lock

  nightly:
    name: Nightly (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+nightly` is not optional: `rust-toolchain.toml` pins `channel =
      # "stable"`, and a rustup toolchain file overrides the default this action
      # sets, so a bare `cargo` here runs stable and this job tests nothing new.
      - name: Test (nightly, informational)
        run: cargo +nightly test --all-targets

  miri:
    name: Miri (undefined behaviour)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # This crate is ~40% unsafe by surface area, and the parts that are *not*
      # FFI -- the duckdb_string_t decoder, the validity bitmap arithmetic, the
      # UUID bit flip, the interval maths, the secret zeroizer -- are exactly
      # what Miri can check. It has already caught two stale-borrow bugs in
      # `src/secrets.rs`'s tests that read a pointer derived before a `&mut`
      # call, which no amount of `cargo test` would have surfaced.
      #
      # Only `--lib` runs here. The integration tests need a real DuckDB, and
      # Miri cannot execute foreign functions; the tests that reach the C API
      # are `#[cfg(feature = "_duckdb-testing")]` and are simply not compiled
      # in this configuration.
      #
      # `-Zmiri-disable-isolation` is needed because proptest reads the current
      # directory to place its regression files.
      - name: Run the library unit tests under Miri
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
          # Miri interprets, so the "-D warnings" the rest of CI uses would also
          # apply to nightly-only lints the stable build never sees.
          RUSTFLAGS: ""
          # proptest's default 256 cases per property costs minutes under an
          # interpreter for no extra coverage of the *unsafe* code, which is
          # what this job is for. `cargo test` still runs the full 256.
          PROPTEST_CASES: "8"
        # `+nightly` is not optional -- see the note in the `nightly` job:
        # `rust-toolchain.toml` pins stable and overrides this action's default,
        # so a bare `cargo miri` resolves to stable, where the `miri` component
        # does not exist.
        # `--features duckdb-1-5-4` matters: without it every `duckdb-1-5*`
        # module is cfg'd out, including `src/arrow.rs` -- the largest block of
        # pure-Rust `unsafe` in the crate, and exactly what Miri is here for.
        # `.cargo/mutants.toml` already sets the same features for the same reason.
        run: cargo +nightly miri test --lib --features duckdb-1-5-4
      # The same tests on a big-endian target. `duckdb_string_t`, HUGEINT and
      # Arrow buffers are native-endian, and the string decoder read them as
      # little-endian until the fifth audit: every test passed on x86-64 while
      # the decoder followed an inline string's bytes as a pointer on s390x.
      # Miri interprets the target, so no s390x runner is needed. criterion's
      # `alloca` dependency compiles a C shim in its build script; Miri never
      # executes it, so the host compiler stands in for the cross compiler.
      - name: Run the library unit tests under Miri, big-endian (s390x)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
          RUSTFLAGS: ""
          PROPTEST_CASES: "8"
          CC_s390x_unknown_linux_gnu: gcc
          AR_s390x_unknown_linux_gnu: ar
        run: cargo +nightly miri test --target s390x-unknown-linux-gnu --lib --features duckdb-1-5-4

  leak-check:
    name: LeakSanitizer (RAII wrappers vs a real DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Half of quack-rs's value proposition is RAII over DuckDB handles:
      # LogicalType, Value, QueryResult, OwnedDataChunk, FileHandle,
      # PreparedStatement, ErrorData, Appender. A missing destructor is not a
      # test failure -- everything still returns the right answer -- so the only
      # way to catch one is to look at the heap afterwards.
      #
      # LeakSanitizer intercepts malloc globally, so it sees DuckDB's C++
      # allocations even though libduckdb itself is not instrumented.
      - name: Fetch a prebuilt libduckdb
        # Version derived from Cargo.lock -- see the note in
        # `test-bundled-prebuilt`. Linking a libduckdb that does not match the
        # bindings libduckdb-sys generated is exactly the kind of mismatch a
        # sanitizer run must not introduce itself.
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "$RUNNER_TEMP/libduckdb"
          echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite under LeakSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=leak"
          # DuckDB's own one-time allocations (extension registry, the default
          # allocator's arenas, static initialisers) are still reachable at
          # exit and are not quack-rs's business. Suppress by library, so a leak
          # from a quack-rs frame is still reported.
          # A two-frame stack is useless for attributing a leak to a missing
          # destructor; 30 is enough to name the quack-rs frame.
          LSAN_OPTIONS: "suppressions=lsan-suppressions.txt:print_suppressions=0:malloc_context_size=30"
        run: |
          # `+nightly` is not optional -- see the note in the `nightly` job.
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --features bundled-test-prebuilt,duckdb-1-5-4 --test ffi_roundtrip

  # AddressSanitizer. LeakSanitizer above answers "did we forget a destructor";
  # ASAN answers "did we write outside an allocation, or use one after it was
  # freed" -- the class that produced the two heap-corruption defects fixed in
  # v0.16.0, and the one a crate doing raw pointer arithmetic into DuckDB's
  # memory is most exposed to. Miri cannot reach it: these paths call foreign
  # functions.
  #
  # Blocking since September 2026. It was `continue-on-error` until it had a
  # green run on main, because libduckdb itself is not instrumented and the
  # first runs might have needed suppressions. It then passed on main (84
  # tests, 6455238) and locally over the 125-test suite with no reports and no
  # suppressions. Add an asan-suppressions.txt only if DuckDB's own frames
  # turn up.
  #
  # ASAN subsumes LSAN, so once this is blocking, `leak-check` can fold into it.
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch a prebuilt libduckdb
        # Version derived from Cargo.lock -- see `test-bundled-prebuilt`.
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "$RUNNER_TEMP/libduckdb"
          echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          # detect_leaks=0: leaks are `leak-check`'s job, with its own
          # suppression file. This run is about memory errors only.
          ASAN_OPTIONS: "detect_leaks=0:detect_stack_use_after_return=1:strict_string_checks=1"
        run: |
          # `+nightly` is not optional -- see the note in the `nightly` job.
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --features bundled-test-prebuilt,duckdb-1-5-4 --test ffi_roundtrip

  semver:
    name: Public API (semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # quack-rs is an SDK: its public API *is* the product, and a downstream
      # extension that stops compiling on a patch release is a worse outcome
      # than a missing feature. This compares the working tree against the
      # published crate and fails when the version bump does not cover the
      # change.
      - name: Install cargo-semver-checks
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-semver-checks --locked --version "0.51.0"
      - name: Check the public API against the last published release
        # cargo-semver-checks derives what to enforce from the version bump.
        # When the bump is itself breaking (a major bump, or a minor bump of a
        # 0.x crate -- it prints "(major change)"), everything is allowed and it
        # runs 0 checks; that is correct for a breaking release, and the next
        # step lists what broke. For any other bump, "0 checks" means nothing
        # was verified, so it fails here rather than passing silently.
        #
        # `--only-explicit-features` with `_duckdb-testing`, not the default
        # heuristic, which also enables `bundled-test` and so compiles each
        # side's C++ test shim against DuckDB's source. The baseline is built
        # with a fresh resolution, which since 2026-10-22 picks `libduckdb-sys`
        # 1.20000.0 (DuckDB 2.0, C++17 headers), and 0.18.0's shim is C++11, so
        # it no longer builds. `_duckdb-testing` gates every public item of the
        # `testing` module, so the API compared is the same; no shim is built.
        run: |
          set -euo pipefail
          cargo semver-checks check-release --only-explicit-features \
            --features duckdb-1-5-4,_duckdb-testing 2>&1 | tee /tmp/semver.log
          if grep -q "(major change)" /tmp/semver.log; then
            echo "::notice::the version bump is breaking, so the published-baseline comparison enforces nothing; review the origin/main comparison for the changelog"
          elif grep -qE "Checked \[[^]]*\] 0 checks" /tmp/semver.log; then
            echo "::error::cargo-semver-checks ran 0 checks against the published baseline for a non-breaking version bump"
            exit 1
          fi
      - name: List public API changes since origin/main (informational)
        # Not a gate: 0.x releases may break, and the published-baseline step
        # already decides pass/fail. `--release-type patch` makes every lint run
        # whatever the two versions are, so each breaking change on this branch
        # is listed -- in the log and the job summary -- for the CHANGELOG
        # review. Needs the full history (`fetch-depth: 0` above).
        continue-on-error: true
        run: |
          set -uo pipefail
          # Same feature set as the step above, for the same reason.
          cargo semver-checks check-release --baseline-rev origin/main --release-type patch \
            --only-explicit-features --features duckdb-1-5-4,_duckdb-testing 2>&1 \
            | tee /tmp/semver-main.log
          {
            echo "### Public API changes since origin/main"
            echo '```'
            tail -n 200 /tmp/semver-main.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    # 60 s per target on a push or pull request; 10 minutes per target on the
    # weekly schedule, which is long enough to grow the corpus meaningfully.
    timeout-minutes: 90
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-08
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The description.yml parser is hand-rolled and reads a file from an
      # arbitrary GitHub repository; the duckdb_string_t decoder reads 16 bytes
      # whose meaning depends on a length field inside them. Both are exactly
      # the shape a fuzzer is good at, and both are reachable from untrusted
      # input in a real extension.
      #
      # A short smoke run per PR, not a campaign: it catches a newly introduced
      # panic without holding up review. The weekly scheduled run is the
      # campaign: longer, and resuming from the corpus the previous scheduled
      # run left in the cache. The committed seeds live in `fuzz/seeds`;
      # `fuzz/corpus` is generated from them plus that cache.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Install cargo-fuzz
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-fuzz --locked --version "0.13.2"
      - name: Run each target briefly
        run: |
          set -euo pipefail
          # `+nightly` is not optional -- see the note in the `nightly` job.
          # Captured first, then checked: `set -e` does not see a failure
          # inside a `for ... in $(...)` word list, so a broken `fuzz list`
          # (or one that printed nothing) used to run zero targets and pass.
          TARGETS=$(cargo +nightly fuzz list --fuzz-dir fuzz)
          if [ -z "$TARGETS" ]; then
            echo "::error::cargo fuzz list printed no targets"
            exit 1
          fi
          for target in $TARGETS; do
            # Targets that call a real DuckDB need the `live` feature and a
            # libduckdb; the next step runs them.
            case " $LIVE_TARGETS " in *" $target "*) continue ;; esac
            echo "::group::$target"
            # Seed from the committed inputs. `fuzz/corpus` is generated and
            # gitignored: keeping a growing corpus in the history would add a
            # megabyte per PR for no review value.
            mkdir -p "fuzz/corpus/$target"
            cp -r "fuzz/seeds/$target/." "fuzz/corpus/$target/"
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- \
              -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
            echo "::endgroup::"
          done
        env:
          LIVE_TARGETS: value_render
      # `value_render` renders values through a real DuckDB, whose
      # `duckdb_get_varchar` and converting getters abort the process on a
      # payload they cannot render: the fuzzer's job is to find one quack-rs
      # lets through. The libduckdb is the one fuzz/Cargo.lock names.
      - name: Download pre-built libduckdb
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh fuzz/Cargo.lock)
          scripts/fetch-duckdb.sh "${DUCKDB_TAG}" lib "${{ runner.temp }}/libduckdb"
      - name: Run the live targets briefly
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: |
          set -euo pipefail
          for target in value_render; do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target"
            cp -r "fuzz/seeds/$target/." "fuzz/corpus/$target/"
            cargo +nightly fuzz run --fuzz-dir fuzz --features live "$target" -- \
              -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
            echo "::endgroup::"
          done
      # Only the scheduled campaign saves the corpus, so a pull request's run
      # can neither grow nor replace what the next campaign starts from.
      - name: Save the fuzz corpus
        if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

  # actionlint: workflow syntax and types, `needs` and `uses` references, the
  # expression contexts, and shellcheck on every `run:` block. The
  # binary is version- and checksum-pinned, like osv-scanner below.
  # scripts/check-workflow-expressions.py predates this job and covers one class
  # of the same errors without a download.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          VER=1.7.12
          # From the release's actionlint_${VER}_checksums.txt (linux_amd64).
          SHA=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL --retry 5 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          echo "${SHA}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: actionlint
        run: |
          set -euo pipefail
          # Without shellcheck on PATH actionlint skips every `run:` block
          # silently; a lint that checks less than it says is worse than none.
          command -v shellcheck >/dev/null || { echo "::error::shellcheck is not installed"; exit 1; }
          # SC2129 ("group these redirects") is style, not a defect.
          ./actionlint -color -ignore 'SC2129'

  # The one check branch protection should require. Every blocking job is in
  # `needs` (scripts/check-ci-aggregate.py, run by the `doc` job, fails when one
  # is missing), so adding or renaming a job never silently drops it from the
  # required set. `if: always()` makes this run, and fail, when a dependency
  # failed or was cancelled, instead of being skipped — a skipped required
  # check counts as passing.
  ci-ok:
    name: CI passed
    if: always()
    needs:
      - check
      - test
      - test-bundled
      - test-bundled-prebuilt
      - test-older-engines
      - test-duckdb-2-0
      - test-duckdb-1-5
      - wasm
      - clippy
      - fmt
      - doc
      - msrv
      - dependency-floor
      - bench-compile
      - example-check
      - scaffold-compile
      - symbol-check
      - abi-table
      - platform-table
      - spdx-list
      - autoload-entries
      - book
      - msrv-vs-duckdb-ci
      - extension-load
      - scaffold-e2e
      - abi-guard
      - abi-guard-layout
      - publish-dry-run
      - security
      - osv-scan
      - miri
      - leak-check
      - asan
      - semver
      - fuzz
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every blocking job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          bad = {job: r["result"] for job, r in results.items() if r["result"] != "success"}
          for job, result in sorted(bad.items()):
              print(f"::error::{job}: {result}")
          print(f"{len(results) - len(bad)}/{len(results)} blocking jobs succeeded")
          sys.exit(1 if bad else 0)
