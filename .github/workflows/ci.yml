# Copyright 2026 Tom F.
#
# Continuous integration — enforces all quality gates.
#
# Jobs: check, test (default + bundled + bundled-prebuilt + duckdb-1-5), wasm,
#       clippy, clippy-beta, fmt, doc, msrv, bench-compile, example-check,
#       scaffold-compile, scaffold-e2e, symbol-check, extension-load,
#       abi-table, abi-guard, msrv-vs-duckdb-ci, publish-dry-run,
#       security, osv-scan, nightly.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# CI builds and executes code from pull requests (cargo test, cargo fuzz, the
# scaffold end-to-end job) and never writes anything back to GitHub, so it gets
# the minimum token rather than inheriting the repository default.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR — saves CI minutes when
# multiple commits are pushed in quick succession.  Main-branch pushes
# are NOT cancelled so merge builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # Harden against transient crates.io/CDN download flakes — notably
  # "[16] Error in the HTTP2 framing layer" when fetching the duckdb+arrow tree.
  # Retry network ops and force HTTP/1.1 (disabling HTTP/2 multiplexing sidesteps
  # the HTTP/2 framing errors). Child cargo invocations inherit these too.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-targets
      # `--all-targets` expands to --lib --bins --tests --benches --examples,
      # which EXCLUDES doctests. Without this step the ~125 examples in the
      # rustdoc were never compiled by CI -- and for an SDK the rustdoc is the
      # product. Linux only: doctests are platform-independent here.
      - if: runner.os == 'Linux'
        run: cargo test --doc --features duckdb-1-5-4

  test-bundled:
    name: Test bundled-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-targets --features bundled-test

  # Exercises the `bundled-test-prebuilt` path: link a pre-built libduckdb
  # instead of compiling DuckDB from C++ source. Combined with duckdb-1-5-4 this
  # is also the only job that runs the DuckDB 1.5.x FFI wrapper tests (appender,
  # selection_vector, instance_cache, ...) against a real DuckDB runtime.
  # Linux only — the pre-built release archive is published per-platform.
  test-bundled-prebuilt:
    name: Test bundled-test-prebuilt (prebuilt libduckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download pre-built libduckdb
        # The version is DERIVED from Cargo.lock, not written here. It used to
        # be hard-coded with a comment asking the next person to keep it in
        # sync with libduckdb-sys; a lockfile bump silently left CI linking a
        # libduckdb one release older than the bindings it was generating.
        # The release zip ships libduckdb.so and duckdb.hpp; the C++ shim is
        # compiled against the latter.
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_TAG}/libduckdb-linux-amd64.zip" -o "${{ runner.temp }}/libduckdb.zip"
          mkdir -p "${{ runner.temp }}/libduckdb"
          unzip -o "${{ runner.temp }}/libduckdb.zip" -d "${{ runner.temp }}/libduckdb"
      - name: Test against pre-built libduckdb
        env:
          # DUCKDB_LIB_DIR resolves headers + link search; LD_LIBRARY_PATH lets the
          # test binary find libduckdb.so at run time (the link-time rpath emitted
          # by libduckdb-sys does not propagate to this downstream test binary).
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo test --all-targets --features bundled-test-prebuilt,duckdb-1-5-4
      # `tests/ffi_roundtrip.rs` is `#![cfg(feature = "_duckdb-testing")]`, so
      # the plain `clippy` job compiles it away to nothing and never lints the
      # largest test file in the repo. Lint it where it is actually built.
      #
      # The env block is repeated rather than shared: `build.rs` needs
      # DUCKDB_LIB_DIR to find `duckdb.hpp` for the C++ shim on *every*
      # invocation, clippy included, and a step without it panics in the build
      # script before clippy ever runs.
      - name: Clippy (including the end-to-end tests)
        env:
          DUCKDB_LIB_DIR: ${{ runner.temp }}/libduckdb
          LD_LIBRARY_PATH: ${{ runner.temp }}/libduckdb
        run: cargo clippy --all-targets --features bundled-test-prebuilt,duckdb-1-5-4 -- -D warnings

  test-duckdb-1-5:
    name: Test duckdb-1-5 / duckdb-1-5-3 / duckdb-1-5-4 features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --features duckdb-1-5
      - run: cargo test --all-targets --features duckdb-1-5
      - run: cargo clippy --all-targets --features duckdb-1-5 -- -D warnings
      - run: cargo check --all-targets --features duckdb-1-5-3
      - run: cargo test --all-targets --features duckdb-1-5-3
      - run: cargo clippy --all-targets --features duckdb-1-5-3 -- -D warnings
      - run: cargo check --all-targets --features duckdb-1-5-4
      - run: cargo test --all-targets --features duckdb-1-5-4
      - run: cargo clippy --all-targets --features duckdb-1-5-4 -- -D warnings

  wasm:
    name: WASM (wasm32-unknown-emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # DuckDB-WASM target. quack-rs's own lib must compile for wasm32; in
      # loadable-extension mode libduckdb-sys is headers-only, so `cargo check`
      # needs no emscripten toolchain. `--all-targets` is intentionally avoided —
      # it would pull the bundled-DuckDB test path, which requires em++.
      - run: cargo check --lib --target wasm32-unknown-emscripten
      - run: cargo check --lib --features duckdb-1-5-4 --target wasm32-unknown-emscripten

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  # Informational early-warning for clippy lints graduating to stable.
  # `beta` becomes `stable` ~6 weeks later, so a failure here gives a heads-up
  # before the lint blocks merges. continue-on-error keeps it non-blocking.
  clippy-beta:
    name: Clippy (beta, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # beta
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+beta` for the same reason as the MSRV job above: without it this ran
      # stable clippy and duplicated the `clippy` job.
      - run: cargo +beta clippy --all-targets --features duckdb-1-5-4 -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Use --features duckdb-1-5-4 (implies duckdb-1-5-3, which implies
      # duckdb-1-5) instead of --all-features
      # because bundled-test requires DuckDB headers from libduckdb-sys, which may
      # not be compiled yet when the build script runs (build scripts only
      # wait for [build-dependencies], not [dependencies]).
      - run: cargo doc --no-deps --features duckdb-1-5-4
        env:
          RUSTDOCFLAGS: "-D warnings"
      # The book's changelog page is a mirror of CHANGELOG.md. Kept by hand it
      # drifted ~19 KB and dropped a whole subsection of the published 0.16.0
      # entry, so it is generated now and checked here.
      - name: Book changelog is in sync with CHANGELOG.md
        run: scripts/sync-book-changelog.py --check
      # The committed sitemap is generated from book/src/SUMMARY.md; nothing
      # checked it, and it fell 14 pages behind.
      - name: Book sitemap is in sync with SUMMARY.md
        run: python3 scripts/generate-sitemap.py --check
      # An invalid workflow file does not fail loudly: GitHub records a run
      # with zero jobs and the workflow silently stops running. That is how the
      # mutation gate stopped executing on PRs -- a shell comment inside a
      # `run:` block wrote out an empty expression while explaining not to use
      # one, and GitHub evaluates expressions even inside shell comments.
      # Neither yaml.safe_load nor a JSON-Schema check sees it: both treat the
      # `run:` block as an opaque string. See scripts/check-workflow-expressions.py.
      - name: Workflow files contain no invalid expressions
        run: scripts/check-workflow-expressions.py

  msrv:
    name: MSRV (1.86.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+1.86.0` is not optional, for the same reason the `nightly` and `miri`
      # jobs below use `+nightly`: `rust-toolchain.toml` pins `channel =
      # "stable"`, and a rustup toolchain file overrides the default this action
      # sets. A bare `cargo check` here runs stable and tests nothing -- the
      # MSRV gate was inert. This matches `cargo +1.86.0 check` in CONTRIBUTING.
      - run: cargo +1.86.0 check

  bench-compile:
    name: Benchmark (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo bench --no-run

  example-check:
    name: Example (hello-ext · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --manifest-path examples/hello-ext/Cargo.toml --all-targets
      - name: Clippy (Linux only)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path examples/hello-ext/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path examples/hello-ext/Cargo.toml

  scaffold-compile:
    name: Scaffold (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify scaffold output compiles
        run: cargo test scaffold_generated_code_compiles -- --nocapture

  symbol-check:
    name: Symbol check (hello-ext · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build hello-ext as cdylib
        run: cargo build --manifest-path examples/hello-ext/Cargo.toml --release
      - name: Verify extension entry point symbol (Linux)
        if: runner.os == 'Linux'
        run: |
          SO="examples/hello-ext/target/release/libhello_ext.so"
          if [ ! -f "$SO" ]; then echo "No libhello_ext.so found"; exit 1; fi
          nm -D "$SO" | grep -q 'T hello_ext_init_c_api' || {
            echo "ERROR: entry point symbol hello_ext_init_c_api not found in $SO"
            nm -D "$SO" | head -20
            exit 1
          }
          echo "Found hello_ext_init_c_api in $SO"
      - name: Verify extension entry point symbol (macOS)
        if: runner.os == 'macOS'
        run: |
          DYLIB="examples/hello-ext/target/release/libhello_ext.dylib"
          if [ ! -f "$DYLIB" ]; then echo "No libhello_ext.dylib found"; exit 1; fi
          nm -g "$DYLIB" | grep -q '_hello_ext_init_c_api' || {
            echo "ERROR: entry point symbol _hello_ext_init_c_api not found in $DYLIB"
            nm -g "$DYLIB" | head -20
            exit 1
          }
          echo "Found _hello_ext_init_c_api in $DYLIB"

  abi-table:
    name: ABI layout table (vs upstream DuckDB headers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Re-derives the DuckDB release -> duckdb_ext_api_v1 slot-count table in
      # src/abi.rs straight from each release's duckdb_extension.h. Fails when a
      # new DuckDB release changes the layout, which is exactly when the runtime
      # guard would start refusing loads it should accept.
      - name: Verify src/abi.rs matches upstream
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- a DuckDB release header was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: |
          python3 scripts/check-abi-table.py || status=$?
          if [ "${status:-0}" -eq 2 ]; then
            echo "::warning::upstream unreachable; check skipped, not failed"
            exit 0
          fi
          exit "${status:-0}"

  platform-table:
    name: Platform list (vs upstream distribution matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # validate::platform only earns its keep if its list is current. DuckDB
      # retired linux_amd64_gcc4 and added the musl targets without quack-rs
      # noticing, so the validator was rejecting real platforms and accepting
      # one that no longer exists. This re-derives the list from the file the
      # community-extensions build actually reads.
      - name: Verify src/validate/platform.rs matches upstream
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- the distribution matrix was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: |
          python3 scripts/check-platform-table.py || status=$?
          if [ "${status:-0}" -eq 2 ]; then
            echo "::warning::upstream unreachable; check skipped, not failed"
            exit 0
          fi
          exit "${status:-0}"

  spdx-list:
    name: SPDX shortlist (vs official registry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A typo in COMMON_SPDX_LICENSES would make quack-rs reject a license
      # nobody could satisfy, and SPDX deprecates identifiers over time
      # (GPL-3.0 -> GPL-3.0-only / -or-later), which would have quack-rs
      # recommending a stale name.
      - name: Verify src/validate/spdx.rs matches the SPDX registry
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- the SPDX registry was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: |
          python3 scripts/check-spdx-list.py || status=$?
          if [ "${status:-0}" -eq 2 ]; then
            echo "::warning::upstream unreachable; check skipped, not failed"
            exit 0
          fi
          exit "${status:-0}"

  msrv-vs-duckdb-ci:
    name: MSRV vs DuckDB's extension CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DuckDB's reusable extension-distribution workflow pins an exact Rust
      # toolchain for some platforms (the WebAssembly job in particular). Raising
      # quack-rs's MSRV above one of those pins silently makes every downstream
      # extension unbuildable for those platforms, with no signal here. This
      # gives that signal.
      - name: Check MSRV against extension-ci-tools' pinned toolchains
        # These guards fetch from upstream. Exit 2 is their documented
        # "could not check" code -- the pinned-toolchain config was unreachable -- and must not
        # be read as drift. Only exit 1 means the checked-in data is wrong.
        run: |
          python3 scripts/check-msrv-vs-duckdb-ci.py || status=$?
          if [ "${status:-0}" -eq 2 ]; then
            echo "::warning::upstream unreachable; check skipped, not failed"
            exit 0
          fi
          exit "${status:-0}"

  extension-load:
    name: Extension load test (DuckDB ${{ matrix.duckdb }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The README claims "quack-rs supports DuckDB 1.4.x and 1.5.x". One
      # `releases/latest` run samples a single point of that claim and silently
      # retargets whenever DuckDB ships. hello-ext uses only the frozen stable
      # prefix and is stamped `C_STRUCT` + `v1.2.0`, so it is supposed to load
      # into every one of these — which is exactly the property worth proving,
      # and the one that would break silently.
      #
      # `latest` stays in the matrix as the early-warning signal for a DuckDB
      # that has not been pinned here yet.
      matrix:
        duckdb: ["v1.4.4", "v1.5.0", "v1.5.5", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build hello-ext as cdylib
        run: cargo build --manifest-path examples/hello-ext/Cargo.toml --release
      - name: Build append_metadata
        run: cargo build --release --bin append_metadata
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          if [ "${{ matrix.duckdb }}" = "latest" ]; then
            url=https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          else
            url=https://github.com/duckdb/duckdb/releases/download/${{ matrix.duckdb }}/duckdb_cli-linux-amd64.zip
          fi
          curl -fsSL "$url" -o duckdb.zip
          unzip -o duckdb.zip
          chmod +x duckdb
          # Record which DuckDB this job is actually testing against. Without
          # it, a failure three steps later is indistinguishable from a wrong
          # answer -- and these jobs pull `releases/latest`, so the version
          # changes underneath them.
          ./duckdb --version
          # Prove the exact invocation the probes use works, before anything
          # depends on it. Two things bit us here: `-no-stdin < file.sql`
          # produced no output and still exited 0, so assertions downstream
          # failed as "wrong answer" when the SQL had never run; and
          # `SET allow_unsigned_extensions=true` is rejected once the database
          # is running ("Cannot change allow_unsigned_extensions setting while
          # database is running"), so it has to be the `-unsigned` startup flag
          # rather than a statement.
          test "$(./duckdb -unsigned -csv -noheader -c 'SELECT 41 + 1;')" = "42" || {
            echo "::error::DuckDB CLI smoke test failed -- `-unsigned -c` did not execute SQL"
            exit 1
          }
      - name: Stamp the extension metadata footer
        # Loading a bare .so skips DuckDB's metadata validation entirely, so the
        # footer this crate writes would never be exercised. Go through the real
        # .duckdb_extension path instead.
        run: |
          set -euo pipefail
          SO="examples/hello-ext/target/release/libhello_ext.so"
          test -f "$SO" || { echo "::error::$SO not found"; exit 1; }
          mkdir -p /tmp/ext
          ./target/release/append_metadata "$SO" /tmp/ext/hello_ext.duckdb_extension \
            --abi-type C_STRUCT \
            --extension-version v0.1.0 \
            --duckdb-version v1.2.0 \
            --platform linux_amd64 \
            --dump
      - name: Load extension and assert query results
        run: |
          set -euo pipefail
          cat > /tmp/probe.sql <<'SQL'
          LOAD '/tmp/ext/hello_ext.duckdb_extension';
          SELECT double_it(21) AS a, first_word('hello world') AS b;
          SQL
          ./duckdb -unsigned -csv -noheader -c "$(cat /tmp/probe.sql)" | tee /tmp/load.log

          # Assert on the actual result, not on the absence of the word "error":
          # a load failure and a wrong answer must both fail this job.
          grep -qx '42,hello' /tmp/load.log || {
            echo "::error::expected '42,hello' from the loaded extension"
            echo "DuckDB $(./duckdb --version) actually produced:"
            cat /tmp/load.log
            exit 1
          }
          echo "Extension loaded and produced correct results"

  scaffold-e2e:
    name: Scaffold end-to-end (build, stamp, load, query)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip -o duckdb.zip
          chmod +x duckdb
          # Record which DuckDB this job is actually testing against. Without
          # it, a failure three steps later is indistinguishable from a wrong
          # answer -- and these jobs pull `releases/latest`, so the version
          # changes underneath them.
          ./duckdb --version
          # Prove the exact invocation the probes use works, before anything
          # depends on it. Two things bit us here: `-no-stdin < file.sql`
          # produced no output and still exited 0, so assertions downstream
          # failed as "wrong answer" when the SQL had never run; and
          # `SET allow_unsigned_extensions=true` is rejected once the database
          # is running ("Cannot change allow_unsigned_extensions setting while
          # database is running"), so it has to be the `-unsigned` startup flag
          # rather than a statement.
          test "$(./duckdb -unsigned -csv -noheader -c 'SELECT 41 + 1;')" = "42" || {
            echo "::error::DuckDB CLI smoke test failed -- `-unsigned -c` did not execute SQL"
            exit 1
          }
      - name: Generate, build, stamp and load a scaffolded extension
        # `scaffold-compile` only checks that the generated sources compile. This
        # job takes the generated project all the way to a .duckdb_extension that
        # a real DuckDB loads and queries — which is what "the scaffold works"
        # actually means.
        run: |
          set -euo pipefail
          cargo build --release --bin append_metadata
          cargo run --release --example scaffold_to_dir -- /tmp/scaffolded
          # Build against this working copy rather than the published crate.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("/tmp/scaffolded/Cargo.toml")
          s = p.read_text()
          # `subn` + assert: if the template's dependency line ever changes
          # shape, a bare `sub` matches nothing and the job silently builds
          # the PUBLISHED crate instead of this working copy.
          s, n = re.subn(r'quack-rs = \{ version = "[^"]+" \}',
                         'quack-rs = { path = "%s" }' % pathlib.Path.cwd(), s)
          assert n == 1, f"expected exactly one quack-rs dependency line, rewrote {n}"
          p.write_text(s)
          PY
          (cd /tmp/scaffolded && cargo build --release)
          ./target/release/append_metadata \
            /tmp/scaffolded/target/release/libmy_analytics.so \
            /tmp/scaffolded/my_analytics.duckdb_extension \
            --abi-type C_STRUCT --extension-version v0.1.0 \
            --duckdb-version v1.2.0 --platform linux_amd64
          cat > /tmp/scaffold_probe.sql <<'SQL'
          LOAD '/tmp/scaffolded/my_analytics.duckdb_extension';
          SELECT my_analytics_hello('world');
          SQL
          ./duckdb -unsigned -csv -noheader -c "$(cat /tmp/scaffold_probe.sql)" | tee /tmp/scaffold.log
          grep -q 'Hello from my_analytics! world' /tmp/scaffold.log || {
            echo "::error::scaffolded extension did not answer correctly"
            echo "DuckDB $(./duckdb --version) actually produced:"
            cat /tmp/scaffold.log
            exit 1
          }
      - name: Generated project passes its own lint gate
        # The generated CI runs `cargo clippy --all-targets -- -D warnings`, so
        # the generated sources must be clean under it from the first commit.
        run: |
          set -euo pipefail
          cd /tmp/scaffolded
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings

  abi-guard:
    name: ABI guard rejects a cross-version unstable build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip -o duckdb.zip
          chmod +x duckdb
          # Record which DuckDB this job is actually testing against. Without
          # it, a failure three steps later is indistinguishable from a wrong
          # answer -- and these jobs pull `releases/latest`, so the version
          # changes underneath them.
          ./duckdb --version
          # Prove the exact invocation the probes use works, before anything
          # depends on it. Two things bit us here: `-no-stdin < file.sql`
          # produced no output and still exited 0, so assertions downstream
          # failed as "wrong answer" when the SQL had never run; and
          # `SET allow_unsigned_extensions=true` is rejected once the database
          # is running ("Cannot change allow_unsigned_extensions setting while
          # database is running"), so it has to be the `-unsigned` startup flag
          # rather than a statement.
          test "$(./duckdb -unsigned -csv -noheader -c 'SELECT 41 + 1;')" = "42" || {
            echo "::error::DuckDB CLI smoke test failed -- `-unsigned -c` did not execute SQL"
            exit 1
          }
      # Regression test for the most dangerous failure mode this crate guards
      # against: an extension that touches the unstable region of
      # duckdb_ext_api_v1, compiled against one DuckDB's headers and loaded into
      # another. Without the guard this corrupts the heap; with it, LOAD fails
      # with a diagnostic. See src/abi.rs.
      - name: Build a demo whose declared DuckDB version contradicts its bindings
        # The refusal must not depend on `releases/latest` differing from the
        # pin: when the runner's DuckDB happens to match, the guard correctly
        # stays silent and this job used to fail claiming the guard was broken.
        #
        # QUACK_RS_TARGET_DUCKDB_VERSION=v1.2.0 (408 slots) against
        # libduckdb-sys =1.10500.0 (DuckDB 1.5.0, 545 slots) is a contradiction
        # the guard can settle without consulting the engine at all, so this
        # fires on every runner.
        env:
          QUACK_RS_TARGET_DUCKDB_VERSION: v1.2.0
        run: |
          set -euo pipefail
          cargo build --release --bin append_metadata
          mkdir -p /tmp/abi_demo/src
          cat > /tmp/abi_demo/Cargo.toml <<EOF
          [package]
          name = "abi_demo"
          version = "0.1.0"
          edition = "2021"

          [lib]
          name = "abi_demo"
          crate-type = ["cdylib"]

          [dependencies]
          quack-rs = { path = "$(pwd)", features = ["duckdb-1-5"] }
          libduckdb-sys = { version = "=1.10500.0", features = ["loadable-extension"] }

          [profile.release]
          opt-level = 1
          panic = "unwind"
          EOF
          cat > /tmp/abi_demo/src/lib.rs <<'EOF'
          use quack_rs::client_context::ClientContext;
          use quack_rs::error::ExtensionError;
          use quack_rs::prelude::*;

          fn register(con: libduckdb_sys::duckdb_connection) -> Result<(), ExtensionError> {
              // duckdb_connection_get_client_context lives past the stable prefix.
              let ctx = unsafe { ClientContext::from_connection(con) }?;
              let _ = ctx.connection_id();
              unsafe { SqlMacro::scalar("abi_demo_ok", &["x"], "x + 1")?.register(con)? };
              Ok(())
          }

          quack_rs::entry_point!(abi_demo_init_c_api, register);
          EOF
          (cd /tmp/abi_demo && cargo build --release)
          ./target/release/append_metadata \
            /tmp/abi_demo/target/release/libabi_demo.so \
            /tmp/abi_demo/abi_demo.duckdb_extension \
            --abi-type C_STRUCT --extension-version v0.1.0 \
            --duckdb-version v1.2.0 --platform linux_amd64
      - name: LOAD must be refused with a layout diagnostic
        run: |
          set -euo pipefail
          cat > /tmp/abi_probe.sql <<'SQL'
          LOAD '/tmp/abi_demo/abi_demo.duckdb_extension';
          SQL
          # DuckDB exits non-zero on the failed LOAD, which is the expected outcome.
          ./duckdb -unsigned -c "$(cat /tmp/abi_probe.sql)" > /tmp/abi.log 2>&1 || true
          echo "--- DuckDB $(./duckdb --version) said: ---"
          cat /tmp/abi.log
          echo "--- end ---"
          # This is the DeclaredVersionMismatch arm of AbiCheck::error_message,
          # pinned by `declared_version_mismatch_matches_the_ci_regression_test`
          # in src/abi.rs so the job and the code cannot drift apart.
          grep -q "QUACK_RS_TARGET_DUCKDB_VERSION says this extension was built against DuckDB" /tmp/abi.log || {
            echo "::error::the ABI guard did not refuse a build whose declared DuckDB version contradicts its bindings"
            exit 1
          }
          # And the extension must not have loaded: a refusal that still
          # registers its functions would be worse than no guard at all.
          ./duckdb -unsigned -csv -noheader -c "LOAD '/tmp/abi_demo/abi_demo.duckdb_extension'; SELECT abi_demo_ok(1);" \
            > /tmp/abi_fn.log 2>&1 || true
          if grep -q '^2$' /tmp/abi_fn.log; then
            echo "::error::the refused extension still registered abi_demo_ok"
            cat /tmp/abi_fn.log
            exit 1
          fi

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --allow-dirty

  security:
    name: Security (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Install cargo-deny
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-deny --locked --version "0.19.0"
      - name: Run cargo-deny check
        run: cargo deny check

  # OSV / GHSA advisory scan. The cargo-deny job above consults only the RustSec
  # advisory database; OSV.dev aggregates GHSA *and* RustSec, so GHSA-only
  # advisories that RustSec has not mirrored (e.g. GHSA-3pv8-6f4r-ffg2 in `tar`)
  # are caught here. Scans both lockfiles — `tar` reaches the example via the
  # `libduckdb-sys` build-dependency. The binary is version- and checksum-pinned.
  osv-scan:
    name: Security (OSV / GHSA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          VER=2.3.8
          SHA=bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64"
          echo "${SHA}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan lockfiles (root + example) against OSV
        run: |
          # All three committed lockfiles. fuzz/Cargo.lock was missing: its
          # dependencies are CI-only, but an unscanned lockfile is an unscanned
          # lockfile.
          ./osv-scanner --config=osv-scanner.toml \
            --lockfile=Cargo.lock \
            --lockfile=examples/hello-ext/Cargo.lock \
            --lockfile=fuzz/Cargo.lock

  nightly:
    name: Nightly (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+nightly` is not optional: `rust-toolchain.toml` pins `channel =
      # "stable"`, and a rustup toolchain file overrides the default this action
      # sets, so a bare `cargo` here runs stable and this job tests nothing new.
      - name: Test (nightly, informational)
        run: cargo +nightly test --all-targets

  miri:
    name: Miri (undefined behaviour)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # This crate is ~40% unsafe by surface area, and the parts that are *not*
      # FFI -- the duckdb_string_t decoder, the validity bitmap arithmetic, the
      # UUID bit flip, the interval maths, the secret zeroizer -- are exactly
      # what Miri can check. It has already caught two stale-borrow bugs in
      # `src/secrets.rs`'s tests that read a pointer derived before a `&mut`
      # call, which no amount of `cargo test` would have surfaced.
      #
      # Only `--lib` runs here. The integration tests need a real DuckDB, and
      # Miri cannot execute foreign functions; the tests that reach the C API
      # are `#[cfg(feature = "_duckdb-testing")]` and are simply not compiled
      # in this configuration.
      #
      # `-Zmiri-disable-isolation` is needed because proptest reads the current
      # directory to place its regression files.
      - name: Run the library unit tests under Miri
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
          # Miri interprets, so the "-D warnings" the rest of CI uses would also
          # apply to nightly-only lints the stable build never sees.
          RUSTFLAGS: ""
          # proptest's default 256 cases per property costs minutes under an
          # interpreter for no extra coverage of the *unsafe* code, which is
          # what this job is for. `cargo test` still runs the full 256.
          PROPTEST_CASES: "8"
        # `+nightly` is not optional -- see the note in the `nightly` job:
        # `rust-toolchain.toml` pins stable and overrides this action's default,
        # so a bare `cargo miri` resolves to stable, where the `miri` component
        # does not exist.
        # `--features duckdb-1-5-4` matters: without it every `duckdb-1-5*`
        # module is cfg'd out, including `src/arrow.rs` -- the largest block of
        # pure-Rust `unsafe` in the crate, and exactly what Miri is here for.
        # `.cargo/mutants.toml` already sets the same features for the same reason.
        run: cargo +nightly miri test --lib --features duckdb-1-5-4

  leak-check:
    name: LeakSanitizer (RAII wrappers vs a real DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Half of quack-rs's value proposition is RAII over DuckDB handles:
      # LogicalType, Value, QueryResult, OwnedDataChunk, FileHandle,
      # PreparedStatement, ErrorData, Appender. A missing destructor is not a
      # test failure -- everything still returns the right answer -- so the only
      # way to catch one is to look at the heap afterwards.
      #
      # LeakSanitizer intercepts malloc globally, so it sees DuckDB's C++
      # allocations even though libduckdb itself is not instrumented.
      - name: Fetch a prebuilt libduckdb
        # Version derived from Cargo.lock -- see the note in
        # `test-bundled-prebuilt`. Linking a libduckdb that does not match the
        # bindings libduckdb-sys generated is exactly the kind of mismatch a
        # sanitizer run must not introduce itself.
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_TAG}/libduckdb-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/libduckdb"
          unzip -o -q libduckdb.zip -d "$RUNNER_TEMP/libduckdb"
          echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite under LeakSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=leak"
          # DuckDB's own one-time allocations (extension registry, the default
          # allocator's arenas, static initialisers) are still reachable at
          # exit and are not quack-rs's business. Suppress by library, so a leak
          # from a quack-rs frame is still reported.
          # A two-frame stack is useless for attributing a leak to a missing
          # destructor; 30 is enough to name the quack-rs frame.
          LSAN_OPTIONS: "suppressions=lsan-suppressions.txt:print_suppressions=0:malloc_context_size=30"
        run: |
          # `+nightly` is not optional -- see the note in the `nightly` job.
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --features bundled-test-prebuilt,duckdb-1-5-4 --test ffi_roundtrip

  # AddressSanitizer. LeakSanitizer above answers "did we forget a destructor";
  # ASAN answers "did we write outside an allocation, or use one after it was
  # freed" -- the class that produced the two heap-corruption defects fixed in
  # v0.16.0, and the one a crate doing raw pointer arithmetic into DuckDB's
  # memory is most exposed to. Miri cannot reach it: these paths call foreign
  # functions.
  #
  # Blocking since September 2026. It was `continue-on-error` until it had a
  # green run on main, because libduckdb itself is not instrumented and the
  # first runs might have needed suppressions. It then passed on main (84
  # tests, 6455238) and locally over the 125-test suite with no reports and no
  # suppressions. Add an asan-suppressions.txt only if DuckDB's own frames
  # turn up.
  #
  # ASAN subsumes LSAN, so once this is blocking, `leak-check` can fold into it.
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch a prebuilt libduckdb
        # Version derived from Cargo.lock -- see `test-bundled-prebuilt`.
        run: |
          set -euo pipefail
          DUCKDB_TAG=$(scripts/duckdb-version-from-lock.sh)
          echo "libduckdb-sys in Cargo.lock corresponds to DuckDB ${DUCKDB_TAG}"
          curl -fsSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_TAG}/libduckdb-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/libduckdb"
          unzip -o -q libduckdb.zip -d "$RUNNER_TEMP/libduckdb"
          echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libduckdb" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          # detect_leaks=0: leaks are `leak-check`'s job, with its own
          # suppression file. This run is about memory errors only.
          ASAN_OPTIONS: "detect_leaks=0:detect_stack_use_after_return=1:strict_string_checks=1"
        run: |
          # `+nightly` is not optional -- see the note in the `nightly` job.
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --features bundled-test-prebuilt,duckdb-1-5-4 --test ffi_roundtrip

  semver:
    name: Public API (semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # quack-rs is an SDK: its public API *is* the product, and a downstream
      # extension that stops compiling on a patch release is a worse outcome
      # than a missing feature. This compares the working tree against the
      # published crate and fails when the version bump does not cover the
      # change.
      - name: Install cargo-semver-checks
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-semver-checks --locked --version "0.50.0"
      - name: Check the public API against the last published release
        run: cargo semver-checks check-release --features duckdb-1-5-4

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The description.yml parser is hand-rolled and reads a file from an
      # arbitrary GitHub repository; the duckdb_string_t decoder reads 16 bytes
      # whose meaning depends on a length field inside them. Both are exactly
      # the shape a fuzzer is good at, and both are reachable from untrusted
      # input in a real extension.
      #
      # A short smoke run per PR, not a campaign: it catches a newly introduced
      # panic without holding up review. `fuzz/corpus` carries the seeds.
      - name: Install cargo-fuzz
        env:
          # Do not build third-party tools with warnings-as-errors:
          # a new rustc warning in any of their dependencies would
          # break CI for a reason unrelated to this repo.
          RUSTFLAGS: ""
        run: cargo install cargo-fuzz --locked --version "0.13.2"
      - name: Run each target briefly
        run: |
          set -euo pipefail
          # `+nightly` is not optional -- see the note in the `nightly` job.
          # Captured first, then checked: `set -e` does not see a failure
          # inside a `for ... in $(...)` word list, so a broken `fuzz list`
          # (or one that printed nothing) used to run zero targets and pass.
          TARGETS=$(cargo +nightly fuzz list --fuzz-dir fuzz)
          if [ -z "$TARGETS" ]; then
            echo "::error::cargo fuzz list printed no targets"
            exit 1
          fi
          for target in $TARGETS; do
            echo "::group::$target"
            # Seed from the committed inputs. `fuzz/corpus` is generated and
            # gitignored: keeping a growing corpus in the history would add a
            # megabyte per PR for no review value.
            mkdir -p "fuzz/corpus/$target"
            cp -r "fuzz/seeds/$target/." "fuzz/corpus/$target/"
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- \
              -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done
