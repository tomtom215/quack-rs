version: 2

updates:
  # ── Cargo dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Group patch/minor updates into a single PR to reduce noise
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"

  # ── Cargo dependencies for the hello-ext example ─────────────────────────────
  - package-ecosystem: cargo
    directory: "/examples/hello-ext"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "example"
    commit-message:
      prefix: "chore(deps/example)"

  # ── Cargo dependencies of the CI-only crates ────────────────────────────────
  # The fuzz targets and the book's doctest harness have their own committed
  # lockfiles (scanned by ci.yml's osv-scan job), so they get updates too.
  - package-ecosystem: cargo
    directories:
      - "/fuzz"
      - "/book/doctest"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps/ci)"
    groups:
      ci-crates:
        patterns:
          - "*"

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    # One PR for every action bump rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
