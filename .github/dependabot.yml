version: 2

updates:
  # ── Cargo dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # The lockfile deliberately stays on the DuckDB 1.5.6 bindings: the 2.0
    # bindings need Rust 1.88 (above the MSRV), and CI's `test-duckdb-2-0` job
    # tests them separately. Bumping them here goes red in six jobs. Move the
    # lockfile by hand when DuckDB 1.5 support ends.
    ignore:
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "libduckdb-sys"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    # Group patch/minor updates into a single PR to reduce noise
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"

  # ── Cargo dependencies for the hello-ext example ─────────────────────────────
  - package-ecosystem: cargo
    directory: "/examples/hello-ext"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "example"
    commit-message:
      prefix: "chore(deps/example)"

  # ── Cargo dependencies of the CI-only crates ────────────────────────────────
  # The fuzz targets and the book's doctest harness have their own committed
  # lockfiles (scanned by ci.yml's osv-scan job), so they get updates too.
  - package-ecosystem: cargo
    directories:
      - "/fuzz"
      - "/book/doctest"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps/ci)"
    groups:
      ci-crates:
        patterns:
          - "*"

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    # One PR for every action bump rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
