#
# cargo-deny configuration for quack-rs
# Docs: https://embarkstudios.github.io/cargo-deny/

# ── Dependency graph ──────────────────────────────────────────────────────────
[graph]
# `true`, not `false`: `duckdb` is an OPTIONAL dependency and the crate declares
# no `default` feature, so the default graph contains neither `duckdb` nor its
# subtree (arrow, chrono, rust_decimal, ...). Both the advisory scan and the
# license scan silently skipped all of it. This also matters for the
# RUSTSEC-2026-0235 justification in `osv-scanner.toml`, which cites this job
# passing as corroboration -- that was only meaningful once the crate in
# question is actually in the graph.
all-features = true
no-default-features = false

# ── License policy ────────────────────────────────────────────────────────────
[licenses]
# Confidence threshold for automated license detection (0.0 – 1.0).
# A crate whose license cannot be detected above this threshold is flagged.
confidence-threshold = 0.8

# Fail on an `allow` entry no dependency uses, so the list cannot grow stale.
unused-allowed-license = "deny"

# SPDX license identifiers that are acceptable across all dependency crates.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# ── Security advisories ───────────────────────────────────────────────────────
[advisories]
# RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]

# A yanked crate in the lockfile fails the build: yanking usually means a
# soundness or security bug, and Cargo.lock is what CI and releases build.
yanked = "deny"

# Unmaintained and unsound crates anywhere in the graph, not only direct
# dependencies (the default scope is "workspace"). No crate in any of the five
# lockfiles is flagged today, so this costs nothing and catches a transitive
# crate being abandoned.
unmaintained = "all"
unsound = "all"

# IDs of advisories to explicitly ignore (document reason in comment).
# Example: ignore = ["RUSTSEC-2023-0001"]  # false positive for our usage pattern
ignore = []

# ── Dependency bans ───────────────────────────────────────────────────────────
[bans]
# Warn when multiple versions of the same crate are pulled in transitively.
# This flags bloat and potential inconsistencies (e.g., two versions of the
# same unsafe crate with different soundness properties).
multiple-versions = "warn"

# Wildcard version requirements (e.g., "*") in direct dependencies: deny. A path
# dependency without a version is not a wildcard in this sense (the examples and
# CI crates depend on the working copy by path).
wildcards = "deny"
allow-wildcard-paths = true

# Highlight which dependency paths cause multiple-version warnings.
highlight = "all"

# Crates that must never appear anywhere in the dependency graph.
deny = []

# Skip specific duplicate-version warnings (document the reason).
# Example:
# skip = [
#     { name = "some-crate", version = "=1.0.0" },  # transitively pinned by foo
# ]
skip = []

# Skip the duplicate-version check for an entire subtree rooted at a crate.
skip-tree = []

# ── Source policy ─────────────────────────────────────────────────────────────
[sources]
# Reject crates from registries other than crates.io.
unknown-registry = "deny"

# Reject crates sourced directly from git (pinned SHAs in Cargo.toml).
# Git sources bypass the crates.io review pipeline and complicate auditing.
unknown-git = "deny"

# Cargo.lock records crates.io as this URL whether the sparse or the git index
# was used, so this is the only form cargo-deny ever sees; listing
# `sparse+https://index.crates.io/` too only produced an `unmatched-source`
# warning on every run.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Uncomment to allow specific git sources (e.g., for unreleased patches):
# allow-git = ["https://github.com/some-org/some-repo"]
allow-git = []
