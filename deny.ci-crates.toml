# SPDX-License-Identifier: MIT
#
# cargo-deny configuration for the repository's other dependency graphs:
# examples/hello-ext, fuzz, book/doctest (and benches/engine, which has no
# committed lockfile). `deny.toml` is written for the published crate and is
# deliberately strict (`unused-allowed-license = "deny"`), which cannot hold for
# graphs with a different set of licenses. Differences, and why:
#
# - NCSA is allowed: libfuzzer-sys is "(MIT OR Apache-2.0) AND NCSA" (LLVM's
#   libFuzzer is vendored), so the fuzz graph cannot pass without it.
# - An unused allowed license is not an error here.
# - Crates marked `publish = false` need no license field (doctest, bench).
#
#   for m in examples/hello-ext fuzz book/doctest; do
#     cargo deny --manifest-path $m/Cargo.toml --config deny.ci-crates.toml check
#   done
#
# Advisories, sources and bans are the same policy as deny.toml.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
